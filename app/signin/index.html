<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — myNovaDash</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090C;--bg-s:#0F0F14;--bg-c:#141418;--bd:rgba(255,255,255,0.055);--bd-m:rgba(255,255,255,0.1);--t1:#EEEEF2;--t2:#72728A;--t3:#3A3A50;--blue:#2563EB;--blue-h:#1D4ED8}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;color:var(--t1)}
nav{padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.logo{font-size:18px;font-weight:700;color:var(--t1);text-decoration:none;letter-spacing:-.4px}
.logo span{color:var(--blue)}
.back{font-size:13px;color:var(--t2);text-decoration:none;font-weight:500;transition:color .2s;display:flex;align-items:center;gap:6px}
.back:hover{color:var(--t1)}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;position:relative;overflow:hidden}
.main::before{content:'';position:absolute;top:-300px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(37,99,235,0.05) 0%,transparent 70%);pointer-events:none}
.box{background:var(--bg-c);border:1px solid var(--bd);border-radius:12px;padding:2.5rem;width:100%;max-width:380px;position:relative;z-index:1}
.box-logo{font-size:18px;font-weight:700;letter-spacing:-.4px;margin-bottom:.375rem}
.box-logo span{color:var(--blue)}
.box-sub{font-size:13px;color:var(--t2);margin-bottom:2rem}
.lbl{display:block;font-size:10px;color:var(--t3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.inp{width:100%;padding:11px 13px;border-radius:7px;border:1px solid var(--bd);background:var(--bg-s);color:var(--t1);font-size:14px;outline:none;font-family:'Space Grotesk',sans-serif;margin-bottom:12px;transition:border-color .2s}
.inp:focus{border-color:var(--blue)}
.inp::placeholder{color:var(--t3)}
.sbtn{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:background .2s;letter-spacing:-.2px}
.sbtn:hover{background:var(--blue-h)}
.sbtn:disabled{opacity:.55;cursor:default}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#FCA5A5;padding:9px 13px;border-radius:7px;font-size:13px;margin-bottom:12px;display:none}
.ok{background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.2);color:#93C5FD;padding:9px 13px;border-radius:7px;font-size:13px;margin-bottom:12px;display:none}
.sw{text-align:center;margin-top:1.25rem;font-size:13px;color:var(--t2)}
.sw a{color:var(--blue);cursor:pointer;text-decoration:none}
.div{display:flex;align-items:center;gap:12px;margin:1.25rem 0}
.div-line{flex:1;height:1px;background:var(--bd)}
.div-text{font-size:11px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.forgot{display:block;text-align:right;font-size:12px;color:var(--t3);text-decoration:none;margin-top:-8px;margin-bottom:12px;cursor:pointer;transition:color .2s;font-weight:500}
.forgot:hover{color:var(--blue)}
footer{padding:1.5rem 2rem;text-align:center;font-size:12px;color:var(--t3)}
footer a{color:var(--t3);text-decoration:none;transition:color .2s}
footer a:hover{color:var(--t2)}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">my<span>Nova</span>Dash</a>
  <a href="/" class="back">← Back to home</a>
</nav>
<div class="main">
  <div class="box">
    <div class="box-logo">my<span>Nova</span>Dash</div>
    <p class="box-sub" id="box-sub">Sign in to your account</p>
    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>
    <div id="name-wrap" style="display:none"><label class="lbl">Your name</label><input class="inp" id="name" type="text" placeholder="Your name"></div>
    <label class="lbl">Email</label>
    <input class="inp" id="email" type="email" placeholder="you@email.com">
    <div id="pass-wrap">
      <label class="lbl">Password</label>
      <input class="inp" id="pass" type="password" placeholder="••••••••" style="margin-bottom:6px">
      <a class="forgot" id="forgot-link" onclick="showForgot()">Forgot password?</a>
    </div>
    <button class="sbtn" id="sbtn" onclick="handleSubmit()">Sign in</button>
    <div class="div"><div class="div-line"></div><div class="div-text">or</div><div class="div-line"></div></div>
    <div class="sw" id="sw">Don't have an account? <a onclick="toggle()">Sign up free</a></div>
  </div>
</div>
<footer><a href="/">myNovaDash</a> &nbsp;·&nbsp; <a href="/">Privacy</a> &nbsp;·&nbsp; <a href="/">Terms</a></footer>
<script>
const sb=supabase.createClient('https://nzccxsbhzovkqojyelxw.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56Y2N4c2Joem92a3FvanllbHh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTI5MDMsImV4cCI6MjA5NDI2ODkwM30.xraOqLGPoPPA0q4bPwzIoDUR3Xz9Kp-p9A7FuY8sRD4');
let mode='signin';
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.style.display='block';document.getElementById('ok').style.display='none';}
function showOk(m){const e=document.getElementById('ok');e.textContent=m;e.style.display='block';document.getElementById('err').style.display='none';}
function clear(){document.getElementById('err').style.display='none';document.getElementById('ok').style.display='none';}
function toggle(){clear();mode=mode==='signin'?'signup':mode==='signup'?'signin':'signin';updateUI();}
function showForgot(){mode='forgot';clear();updateUI();}
function updateUI(){
  const titles={signin:'Welcome back',signup:'Create your account',forgot:'Reset password'};
  const subs={signin:'Sign in to your myNovaDash account',signup:'Start tracking your freelance business for free',forgot:"Enter your email and we'll send you a reset link"};
  const btns={signin:'Sign in',signup:'Create account',forgot:'Send reset link'};
  const sws={signin:"Don't have an account? <a onclick='toggle()'>Sign up free</a>",signup:"Already have an account? <a onclick='toggle()'>Sign in</a>",forgot:"Remember your password? <a onclick='toggle()'>Sign in</a>"};
  document.getElementById('box-sub').textContent=subs[mode];
  document.getElementById('sbtn').textContent=btns[mode];
  document.getElementById('sw').innerHTML=sws[mode];
  document.getElementById('name-wrap').style.display=mode==='signup'?'block':'none';
  document.getElementById('pass-wrap').style.display=mode==='forgot'?'none':'block';
}
async function handleSubmit(){
  const email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value,name=document.getElementById('name').value.trim(),btn=document.getElementById('sbtn');
  clear();if(!email){showErr('Please enter your email');return;}
  btn.disabled=true;btn.textContent='Loading...';
  if(mode==='forgot'){const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/app'});if(error)showErr(error.message);else showOk('Reset link sent. Check your email.');btn.disabled=false;updateUI();return;}
  if(!pass){showErr('Please enter your password');btn.disabled=false;updateUI();return;}
  if(mode==='signup'){if(!name){showErr('Please enter your name');btn.disabled=false;return;}const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name}}});if(error){showErr(error.message);btn.disabled=false;updateUI();return;}if(data.user){window.location.href='/app';}else{showOk('Check your email to confirm your account, then sign in.');btn.disabled=false;updateUI();}}
  else{const{data,error}=await sb.auth.signInWithPassword({email,password:pass});if(error){showErr('Invalid email or password');btn.disabled=false;updateUI();return;}if(data.user)window.location.href='/app';}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')handleSubmit();});
window.addEventListener('load',async()=>{const{data:{session}}=await sb.auth.getSession();if(session?.user)window.location.href='/app';});
</script>
</body>
</html>
