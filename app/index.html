<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>myNovaDash — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090C;--bg-s:#0F0F14;--bg-c:#141418;--bg-e:#1A1A22;--bd:rgba(255,255,255,0.055);--bd-m:rgba(255,255,255,0.1);--t1:#EEEEF2;--t2:#72728A;--t3:#3A3A50;--p1:#2563EB;--p1h:#1D4ED8;--p1s:rgba(37,99,235,0.12);--p1b:rgba(37,99,235,0.25);--p2:#7C3AED;--ok:#22C55E;--err:#EF4444;--warn:#EAB308}
body{font-family:'Space Grotesk',sans-serif;color:var(--t1);background:var(--bg);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.auth-box{background:var(--bg-c);border:1px solid var(--bd);border-radius:12px;padding:2.5rem;width:100%;max-width:380px}
.al{display:block;font-size:10px;color:var(--t3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.ai{width:100%;padding:11px 13px;border-radius:7px;border:1px solid var(--bd);background:var(--bg-s);color:var(--t1);font-size:14px;outline:none;font-family:'Space Grotesk',sans-serif;margin-bottom:12px;transition:border-color .2s}
.ai:focus{border-color:var(--p1)}.ai::placeholder{color:var(--t3)}
.auth-btn{width:100%;padding:11px;background:var(--p1);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:background .2s}
.auth-btn:hover{background:var(--p1h)}
.auth-switch{text-align:center;margin-top:1.25rem;font-size:13px;color:var(--t2)}
.auth-switch a{color:var(--p1);cursor:pointer}
.auth-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#FCA5A5;padding:9px 13px;border-radius:7px;font-size:13px;margin-bottom:12px;display:none}
#app{display:none;flex-direction:column;min-height:100vh}
nav{background:var(--bg-s);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100}
.nav-logo{text-decoration:none;display:flex;align-items:center;gap:10px}
.nav-right{display:flex;gap:6px}
.nb{padding:5px 11px;font-size:12px;border-radius:6px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--t2);font-family:'Space Grotesk',sans-serif;transition:all .2s;font-weight:500}
.nb:hover{background:var(--bg-e);color:var(--t1);border-color:var(--bd-m)}
.nb.active{background:var(--p1s);border-color:var(--p1b);color:var(--t1)}
.main{flex:1;padding:1.5rem;max-width:1020px;margin:0 auto;width:100%}
.theme-panel{background:var(--bg-c);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.mode-btns{display:flex;gap:6px;margin-top:8px}
.mode-btn{padding:6px 16px;font-size:12px;font-weight:600;border-radius:6px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--t2);font-family:'Space Grotesk',sans-serif;transition:all .2s}
.mode-btn.active{background:var(--p1);color:#fff;border-color:var(--p1)}
.mode-btn:hover:not(.active){background:var(--bg-e);color:var(--t1)}
.palette-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pal-swatch{width:36px;height:36px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .2s;display:flex;align-items:center;justify-content:center}
.pal-swatch:hover{transform:scale(1.1)}
.pal-inner{width:20px;height:20px;border-radius:4px}
.rbar{background:var(--bg-c);border:1px solid var(--bd);border-radius:8px;padding:.6rem 1rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{padding:3px 10px;font-size:12px;cursor:pointer;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--t2);font-family:'Space Grotesk',sans-serif;transition:all .2s;font-weight:500}
.chip.active{background:var(--p1s);border-color:var(--p1b);color:var(--t1)}
.chip:hover:not(.active){background:var(--bg-e);color:var(--t1)}
.chip.red{color:var(--err);border-color:rgba(239,68,68,.2)}
.rni{margin-left:auto;font-size:12px;padding:3px 8px;border:1px solid var(--bd);border-radius:5px;color:var(--t1);font-family:'Space Grotesk',sans-serif;width:130px;text-align:right;background:transparent}
.rni:focus{outline:none;border-color:var(--bd-m)}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:1.25rem;flex-wrap:wrap}
.tab-btn{padding:10px 14px;font-size:12px;cursor:pointer;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--t2);font-family:'Space Grotesk',sans-serif;transition:all .2s;margin-bottom:-1px;font-weight:500}
.tab-btn.active{color:var(--t1);border-bottom-color:var(--p1)}
.card{background:var(--bg-c);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1rem}
.ct{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:1rem}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;margin-bottom:1rem;background:var(--bd);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.kpi{background:var(--bg-c);padding:1rem 1.25rem}
.kpi-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;font-weight:600}
.kpi-v{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;line-height:1}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.cw{position:relative;height:180px}
.mchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.ig{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ig label{display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:600}
.pr{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.pr select{padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;font-family:'Space Grotesk',sans-serif;color:var(--t1);background:var(--bg-s)}
.pr select:focus{outline:none;border-color:var(--bd-m)}
.ih{display:flex;justify-content:space-between;align-items:flex-start}
.gb{padding:7px 14px;background:var(--p1);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;flex-shrink:0;margin-left:12px;transition:background .2s}
.gb:hover{background:var(--p1h)}.gb:disabled{opacity:.5;cursor:default}
.ib{background:var(--bg-s);border:1px solid var(--bd);border-radius:7px;padding:14px 16px;font-size:13px;line-height:1.8;color:var(--t2);white-space:pre-wrap;margin-top:14px}
.an{background:rgba(234,179,8,.07);border:1px solid rgba(234,179,8,.15);border-radius:7px;padding:12px 14px;font-size:13px;color:#CA8A04;margin-top:14px}
.an a{color:#EAB308;font-weight:600}
.cr{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.cr:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.cd{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.gbw{margin-bottom:16px}
.gbh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;color:var(--t2)}
.gbb{height:3px;background:var(--bg-e);border-radius:2px;overflow:hidden}
.gbf{height:100%;border-radius:2px;transition:width .4s}
.cc{border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;background:var(--bg-c);margin-bottom:10px}
.leg{display:flex;gap:14px;font-size:10px;color:var(--t3);margin-bottom:12px;flex-wrap:wrap;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ld{width:6px;height:6px;border-radius:1px;display:inline-block;margin-right:5px}
.btn{padding:7px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;border:1px solid var(--bd);background:transparent;color:var(--t2);transition:all .2s}
.btn:hover{background:var(--bg-e);color:var(--t1);border-color:var(--bd-m)}
.btn.blue{background:var(--p1);color:#fff;border-color:var(--p1)}.btn.blue:hover{background:var(--p1h)}
.btn.sm{padding:4px 9px;font-size:11px}
.sp{background:var(--bg-s);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1rem}
.sp textarea{width:100%;font-size:10px;height:48px;font-family:'JetBrains Mono',monospace;resize:none;border:1px solid var(--bd);border-radius:5px;padding:8px;margin-bottom:10px;box-sizing:border-box;background:var(--bg-c);color:var(--t2)}
.empty{text-align:center;padding:2.5rem;color:var(--t3);font-size:13px}
.di{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;color:var(--t1);background:var(--bg-s);font-family:'Space Grotesk',sans-serif}
.di:focus{outline:none;border-color:var(--bd-m)}
.nim{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;color:var(--t1);background:var(--bg-s);font-family:'JetBrains Mono',monospace}
.nim:focus{outline:none;border-color:var(--bd-m)}
/* Calendar */
.cal-notice{background:var(--bg-e);border:1px solid var(--bd);border-radius:7px;padding:9px 14px;margin-bottom:1rem;font-size:12px;color:var(--t3);display:flex;align-items:center;gap:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dh{text-align:center;font-size:10px;font-weight:600;color:var(--t3);padding:6px 0;text-transform:uppercase;letter-spacing:.05em}
.cal-cell{min-height:76px;border-radius:6px;padding:8px 7px;border:1px solid var(--bd);background:var(--bg-s);cursor:pointer;transition:border-color .15s,background .15s;position:relative;overflow:hidden}
.cal-cell:hover{border-color:var(--bd-m);background:var(--bg-e)}
.cal-cell.sel{border-color:var(--p1)!important;background:var(--p1s)!important}
.cal-cell.has-actual{border-color:rgba(37,99,235,0.25);background:rgba(37,99,235,0.05)}
.cal-cell.has-proj{border:1px dashed rgba(234,179,8,0.35);background:rgba(234,179,8,0.04)}
.cal-cell.has-actual.has-proj{border:1px solid rgba(37,99,235,0.25);background:rgba(37,99,235,0.04)}
.cal-empty{min-height:76px}
.day-n{font-size:12px;font-weight:500;color:var(--t2);display:block;margin-bottom:3px}
.day-r{font-size:10px;color:var(--ok);font-family:'JetBrains Mono',monospace;display:block;line-height:1.5}
.day-e{font-size:10px;color:var(--err);font-family:'JetBrains Mono',monospace;display:block;line-height:1.5}
.day-pr{font-size:10px;color:#CA8A04;font-family:'JetBrains Mono',monospace;display:block;line-height:1.5}
.day-nt{font-size:9px;color:var(--t3);display:block;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* Picker */
.month-picker{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:300;background:var(--bg-c);border:1px solid var(--bd-m);border-radius:10px;padding:1rem 1.25rem;min-width:260px;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:fade .15s ease}
.picker-month-btn{padding:7px 4px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Space Grotesk',sans-serif;border:1px solid transparent;background:transparent;color:var(--t2);transition:all .15s;width:100%}
.picker-month-btn:hover{background:var(--bg-e);color:var(--t1)}
.picker-month-btn.active{border-color:var(--p1);background:var(--p1s);color:var(--t1)}
/* Tools */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:1rem}
.tools-result{background:var(--bg-s);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;margin-top:1rem}
.tax-breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:1rem}
.tax-item{background:var(--bg-c);padding:.75rem 1rem}
.tax-label{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:4px}
.tax-val{font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--t1)}
.step-badge{width:22px;height:22px;border-radius:50%;background:var(--p1s);border:1px solid var(--p1b);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--p1);flex-shrink:0}
.info-green{background:rgba(34,197,94,0.07);border:1px solid rgba(34,197,94,0.15);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.info-blue{background:var(--p1s);border:1px solid var(--p1b);border-radius:8px;padding:12px 14px}
/* Import */
.dz{border:1.5px dashed var(--bd-m);border-radius:10px;padding:3rem 2rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg-s)}
.dz:hover,.dz.over{border-color:var(--p1);background:var(--p1s)}
.spinner{width:36px;height:36px;border:2px solid var(--bd);border-top-color:var(--p1);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 1.5rem}
.fmt-badge{padding:3px 9px;background:var(--bg-e);border:1px solid var(--bd);border-radius:5px;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.preview-table{width:100%;border-collapse:collapse;font-size:12px}
.preview-table th{padding:8px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;border-bottom:1px solid var(--bd)}
.preview-table td{padding:5px 8px;border-bottom:1px solid var(--bd)}
.preview-table tr:last-child td{border-bottom:none}
.preview-table input{width:100%;padding:5px 8px;border:1px solid transparent;border-radius:5px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--t1);background:transparent;transition:border-color .2s}
.preview-table input:hover{border-color:var(--bd)}
.preview-table input:focus{outline:none;border-color:var(--p1);background:var(--bg-s)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:500;padding:1rem}
.modal-box{background:var(--bg-c);border:1px solid var(--bd);border-radius:12px;padding:2rem;max-width:480px;width:100%;max-height:85vh;overflow-y:auto}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg-s)}::-webkit-scrollbar-thumb{background:var(--bg-e);border-radius:3px}
@media(max-width:600px){.cg{grid-template-columns:1fr}.ig{grid-template-columns:repeat(2,1fr)}.kpi-grid{grid-template-columns:repeat(2,1fr)}.cal-grid{gap:2px}.cal-cell{min-height:56px;padding:5px 4px}}

.tip-btn{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--bg-e);border:1px solid var(--bd);color:var(--t3);font-size:9px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;margin-left:6px;vertical-align:middle;flex-shrink:0;transition:all .15s}
.tip-btn:hover{background:var(--p1s);border-color:var(--p1b);color:var(--p1)}
.tip-wrap{position:relative;display:inline-block}
.tip-box{position:absolute;left:0;top:22px;z-index:500;background:rgba(20,20,24,0.97);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 13px;font-size:12px;color:var(--t2);line-height:1.7;min-width:220px;max-width:280px;box-shadow:0 8px 28px rgba(0,0,0,0.5);font-weight:400;display:block;white-space:normal}
.tour-btn-skip{font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;padding:0;transition:color .15s}
.tour-btn-skip:hover{color:var(--t2)}
.tour-highlight{outline:3px solid var(--blue)!important;outline-offset:4px;border-radius:8px;animation:tour-pulse 1.5s ease infinite}
@keyframes tour-pulse{0%,100%{outline-color:var(--blue);box-shadow:0 0 0 0 rgba(37,99,235,0.4);}50%{outline-color:#60A5FA;box-shadow:0 0 20px rgba(37,99,235,0.25);}}
</style>
</head>
<body>
<div id="loading">
  <div style="display:flex;align-items:center;gap:10px">
    <svg width="30" height="27" viewBox="0 0 40 36" fill="none"><line x1="0" y1="34" x2="40" y2="34" stroke="#2E2E44" stroke-width=".75"/><path d="M2,34 L2,27 L7,21 L11,25 L16,23 L20,28 L25,22 L30,17 L38,3 L38,34 Z" fill="rgba(37,99,235,0.07)"/><polyline points="2,27 7,21 11,25 16,23 20,28 25,22 30,17" stroke="#5A5A78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="30" y1="17" x2="38" y2="3" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/><circle cx="38" cy="3" r="2.5" fill="#2563EB"/></svg>
    <div style="line-height:1;display:flex;align-items:baseline"><span style="color:#9090A8;font-weight:300;font-size:11px;letter-spacing:.5px">my</span><span style="color:#2563EB;font-weight:400;font-size:16px;letter-spacing:-.3px">Nova</span><span style="color:#9090A8;font-weight:300;font-size:16px;letter-spacing:-.3px">Dash</span></div>
  </div>
</div>
<div id="auth-screen" style="display:none">
  <div class="auth-box">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:.375rem">
      <svg width="24" height="22" viewBox="0 0 40 36" fill="none"><line x1="0" y1="34" x2="40" y2="34" stroke="#2E2E44" stroke-width=".75"/><path d="M2,34 L2,27 L7,21 L11,25 L16,23 L20,28 L25,22 L30,17 L38,3 L38,34 Z" fill="rgba(37,99,235,0.07)"/><polyline points="2,27 7,21 11,25 16,23 20,28 25,22 30,17" stroke="#5A5A78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="30" y1="17" x2="38" y2="3" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/><circle cx="38" cy="3" r="2.5" fill="#2563EB"/></svg>
      <div style="line-height:1;display:flex;align-items:baseline"><span style="color:#9090A8;font-weight:300;font-size:10px;letter-spacing:.5px">my</span><span style="color:#2563EB;font-weight:400;font-size:14px;letter-spacing:-.3px">Nova</span><span style="color:#9090A8;font-weight:300;font-size:14px;letter-spacing:-.3px">Dash</span></div>
    </div>
    <p style="font-size:13px;color:var(--t2);margin-bottom:2rem" id="auth-sub">Sign in to your account</p>
    <div class="auth-err" id="auth-error"></div>
    <div id="name-wrap" style="display:none"><label class="al">Your name</label><input class="ai" id="auth-name" type="text" placeholder="Your name"></div>
    <label class="al">Email</label><input class="ai" id="auth-email" type="email" placeholder="you@email.com">
    <label class="al">Password</label><input class="ai" id="auth-pass" type="password" placeholder="••••••••">
    <button class="auth-btn" id="auth-btn" onclick="handleAuth()">Sign in</button>
    <div class="auth-switch" id="auth-switch">Don't have an account? <a onclick="toggleAuth()">Sign up</a></div>
  </div>
</div>
<div id="app" style="display:none;flex-direction:column;min-height:100vh">
  <nav>

              <button class="btn sm" onclick="adjPickerYear(-1)">←</button>

    h+=`<div class="kpi"><div class="kpi-l">Net so far</div><div class="kpi-v" style="color:${actRev-actExp>=0?'var(--ok)':'var(--err)'};font-size:16px">${fmt(actRev-actExp)}</div></div>`;
    if(projRev>0||projExp>0){h+=`<div class="kpi"><div class="kpi-l">Manual projected</div><div class="kpi-v" style="color:#CA8A04;font-size:16px">~${fmt(projRev)}</div></div>`;}
    if(invProjTot>0){h+=`<div class="kpi"><div class="kpi-l">Invoices due</div><div class="kpi-v" style="color:#CA8A04;font-size:16px">~${fmt(invProjTot)}</div></div>`;}
    if(invProjTot>0||projRev>0){h+=`<div class="kpi"><div class="kpi-l">Total expected</div><div class="kpi-v" style="color:var(--p1);font-size:16px">${fmt(actRev+projRev+invProjTot)}</div></div>`;}

  }

  h+=`<div class="cal-grid" style="margin-bottom:3px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dh">${d}</div>`).join('')}</div>`;

  for(let i=0;i<firstDay;i++)h+=`<div class="cal-empty"></div>`;
  for(let d=1;d<=dim;d++){
    const k=dayKey(calYear,calMonth,d),dt=r.daily_data?.[k];
    const invK='inv:'+k,invArr=r.daily_data?.[invK]||[];
    const invTot=invArr.reduce((s,i)=>s+i.amount,0);
    const invClients=invArr.map(i=>i.client).join(', ');
    const isProj=dt?.projected===true,hasActual=dt&&!isProj&&(dt.revenue>0||dt.expenses>0),hasAnyData=dt&&(dt.revenue>0||dt.expenses>0);
    const hasInv=invArr.length>0;
    const isSel=calSelectedDay===d,isTod=isNow&&today.getDate()===d;
    const cd=cellDate(calYear,calMonth,d),isFuture=cd>todayMidnight();

    if(isTod)cls+=' tod';
    h+=`<div class="${cls}" onclick="selectDay(${d})">

  if(calSelectedDay!==null){
    const k=dayKey(calYear,calMonth,calSelectedDay),dt=r.daily_data?.[k]||{revenue:0,expenses:0,hours:0,note:'',projected:false};
    const cd=cellDate(calYear,calMonth,calSelectedDay),isFut=cd>todayMidnight(),isTod2=cd.getTime()===todayMidnight().getTime(),isPast=cd<todayMidnight();
    const defaultProj=isFut&&!dt.projected===true?true:dt.projected;

    h+=`<div class="card" style="animation:fade .2s ease">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <div>

      <div style="display:flex;gap:8px">
        <button class="btn blue" onclick="saveDayEntry(${calYear},${calMonth},${calSelectedDay})">Save →</button>
        ${(dt.revenue>0||dt.expenses>0||dt.note)?`<button class="btn" onclick="clearDayEntry(${calYear},${calMonth},${calSelectedDay})" style="color:var(--err);border-color:rgba(239,68,68,.2)">Clear day</button>`:''}
      </div>
    </div>`;
  }

  const apiKey=localStorage.getItem('nd_api_key')||'';
  const days=Array.from({length:dim},(_,i)=>i+1);
  const hasAnyDailyData=days.some(d=>{const k=dayKey(calYear,calMonth,d);const dt=r.daily_data?.[k];return dt&&(dt.revenue>0||dt.expenses>0||dt.hours>0);});
  if(hasAnyDailyData){
    h+=`<div class="card"><div class="ih"><div><p style="font-size:13px;font-weight:600;color:var(--t1)">Daily pattern insights</p><p style="font-size:11px;color:var(--t3);margin-top:2px;text-transform:uppercase;letter-spacing:.05em;font-weight:600">AI analysis of ${MN[calMonth]} ${calYear} day-by-day data</p></div><button class="gb" onclick="genCalInsights()" ${!apiKey||calInsightsLoading?'disabled':''}>${calInsightsLoading?'Analyzing...':!apiKey?'Add API key in Overview':'Analyze this month →'}</button></div>${!apiKey?`<div class="an" style="margin-top:12px">Add your Anthropic API key in the Overview tab to use AI insights.</div>`:''}${calInsights?`<div class="ib">${calInsights}</div>`:''}</div>`;
  }
  const hasChart=days.some(d=>{const k=dayKey(calYear,calMonth,d);return r.daily_data?.[k]?.revenue>0||r.daily_data?.[k]?.expenses>0;});
  if(hasChart){
    h+=`<div class="cg">
      <div class="card">
        <p class="ct">Daily revenue vs expenses</p>
        <div class="leg"><span><span class="ld" style="background:${p1}"></span>Actual revenue</span><span><span class="ld" style="background:${p2}"></span>Actual expenses</span><span><span class="ld" style="background:#CA8A04"></span>Projected</span></div>
        <div class="cw"><canvas id="cCalDaily" role="img" aria-label="Daily revenue vs expenses">Daily data.</canvas></div>
      </div>
      <div class="card">
        <p class="ct">Cumulative profit — ${MN[calMonth]} ${calYear}</p>
        <div class="cw"><canvas id="cCalCum" role="img" aria-label="Cumulative profit">Cumulative profit.</canvas></div>
      </div>
    </div>`;
  }
  return h;
}

function tip(id){return `<span class="tip-wrap"><button class="tip-btn" onclick="event.stopPropagation();toggleTip('${id}')">?</button><span id="tt-${id}" class="tip-box" style="display:none">${TOOLTIPS[id]||''}</span></span>`;}
function toggleTip(id){document.querySelectorAll('.tip-box').forEach(el=>{if(el.id!=='tt-'+id)el.style.display='none';});const el=document.getElementById('tt-'+id);if(el)el.style.display=el.style.display==='none'?'block':'none';}

function startTour(){tourStep=0;renderTour();}
function endTour(){tourStep=null;localStorage.setItem('nd_tour_done','1');document.getElementById('tour-overlay')?.remove();document.querySelectorAll('.tour-highlight').forEach(el=>el.classList.remove('tour-highlight'));}

function prevTourStep(){if(tourStep>0){tourStep--;renderTour();}}

function _buildTourOverlay(){
  document.getElementById('tour-overlay')?.remove();
  if(tourStep===null)return;
  const step=TOUR_STEPS[tourStep];
  const overlay=document.createElement('div');
  overlay.id='tour-overlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:9990';
  let svgHtml='',tipStyle='';
  const pad=12;
  if(step.target){
    const el=document.getElementById(step.target);
    if(el){
      const rc=el.getBoundingClientRect();
      const tx=rc.left-pad,ty=rc.top-pad,tw=rc.width+pad*2,th=rc.height+pad*2;
      svgHtml=`<svg style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none"><defs><mask id="tm"><rect width="100%" height="100%" fill="white"/><rect x="${tx}" y="${ty}" width="${tw}" height="${th}" rx="10" fill="black"/></mask></defs><rect width="100%" height="100%" fill="rgba(9,9,12,0.82)" mask="url(#tm)"/></svg>`;
      const vw=window.innerWidth,vh=window.innerHeight;
      const cx=Math.max(16,Math.min(tx,vw-344));
      if(step.pos==='bottom'){const by=Math.min(ty+th+16,vh-220);tipStyle=`top:${by}px;left:${cx}px`;}
      else{const ay=Math.max(16,ty-220);tipStyle=`top:${ay}px;left:${cx}px`;}
    }else{svgHtml=`<svg style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none"><rect width="100%" height="100%" fill="rgba(9,9,12,0.82)"/></svg>`;tipStyle='top:50%;left:50%;transform:translate(-50%,-50%)';}
  }else{svgHtml=`<svg style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none"><rect width="100%" height="100%" fill="rgba(9,9,12,0.82)"/></svg>`;tipStyle='top:50%;left:50%;transform:translate(-50%,-50%)';}
  const isLast=tourStep===TOUR_STEPS.length-1;
  overlay.innerHTML=`${svgHtml}<div style="position:fixed;${tipStyle};z-index:9991;background:var(--bg-e);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:1.5rem;width:320px;box-shadow:0 24px 64px rgba(0,0,0,0.6);pointer-events:all"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px"><p style="font-size:15px;font-weight:700;color:var(--t1);letter-spacing:-.4px;line-height:1.3">${step.title}</p><span style="font-size:11px;color:var(--t3);white-space:nowrap;margin-left:12px;font-family:'JetBrains Mono',monospace">${tourStep+1}/${TOUR_STEPS.length}</span></div><p style="font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:1.25rem">${step.desc}</p><div style="display:flex;align-items:center;justify-content:space-between"><button class="tour-btn-skip" onclick="endTour()">Skip tour</button><div style="display:flex;gap:8px">${tourStep>0?`<button class="btn sm" onclick="prevTourStep()">← Back</button>`:''}<button class="btn blue sm" onclick="nextTourStep()">${isLast?'Done ✓':'Next →'}</button></div></div></div>`;
  document.body.appendChild(overlay);
}
function renderTour(){
  document.getElementById('tour-overlay')?.remove();
  document.querySelectorAll('.tour-highlight').forEach(el=>el.classList.remove('tour-highlight'));
  if(tourStep===null)return;
  const step=TOUR_STEPS[tourStep];
  if(step.target){
    const el=document.getElementById(step.target);
    if(el){
      el.classList.add('tour-highlight');
      el.scrollIntoView({behavior:'smooth',block:'center'});
      setTimeout(_buildTourOverlay,380);
      return;
    }
  }
  _buildTourOverlay();
}

async function genCompareInsights(){
  const apiKey=localStorage.getItem('nd_api_key');
  if(!apiKey){showToast('Add your API key in the AI Insights section first','warn');return;}
  const r=getR();if(!r||!compR)return;
  compareInsightsLoading=true;render();
  const labels=getLabels(r.start_month,r.start_year,r.duration);
  const cLabels=getLabels(compR.start_month,compR.start_year,compR.duration);
  const d1=r.month_data.map((m,i)=>`${labels[i]?.label||'Month '+(i+1)}: Rev $${m.revenue}, Exp $${m.expenses}, Hrs ${m.hours}`).join('; ');
  const d2=compR.month_data.map((m,i)=>`${cLabels[i]?.label||'Month '+(i+1)}: Rev $${m.revenue}, Exp $${m.expenses}, Hrs ${m.hours}`).join('; ');
  const t1=r.month_data.reduce((s,m)=>s+m.revenue,0),e1=r.month_data.reduce((s,m)=>s+m.expenses,0);
  const t2=compR.month_data.reduce((s,m)=>s+m.revenue,0),e2=compR.month_data.reduce((s,m)=>s+m.expenses,0);
  const prompt=`You are a financial analyst for a freelance business. Compare these two periods and give exactly 5 specific numbered insights about what changed, improved, or declined between them. Be specific with numbers and percentages. End with one clear actionable recommendation.

${r.name}: ${d1}
Total revenue: $${t1}, Total expenses: $${e1}, Net profit: $${t1-e1}

${compR.name}: ${d2}
Total revenue: $${t2}, Total expenses: $${e2}, Net profit: $${t2-e2}

${r.profile?.type?`Business type: ${r.profile.type}`:''}
Focus on: revenue trends, profit changes, efficiency, consistency, and a clear recommendation.`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const data=await res.json();
    compareInsights=data.content?.[0]?.text||'';
  }catch(e){showToast('Failed to generate comparison insights','err');}
  compareInsightsLoading=false;render();
}

// EXPENSE CATEGORIES
const EXP_CATS=['Software & Subscriptions','Equipment & Hardware','Travel & Transportation','Marketing & Advertising','Subcontractors & Freelancers','Office & Supplies','Education & Training','Professional Services','Phone & Internet','Meals & Entertainment','Other'];
const EXP_COLORS=['#3B82F6','#8B5CF6','#F59E0B','#EC4899','#10B981','#6366F1','#F97316','#14B8A6','#EF4444','#A78BFA','#72728A'];

function getExpCatKey(year,month){return `${year}-${String(month+1).padStart(2,'0')}`;}
function getDayExpCatKey(y,m,d){return dayKey(y,m,d);}

function updMonthExpCat(monthIdx,cat,amount){
  const r=getR();if(!r)return;
  const labels=getLabels(r.start_month,r.start_year,r.duration);
  const lbl=labels[monthIdx];
  if(!lbl)return;
  const parts=lbl.label.split(' ');
  const mo=MN.findIndex(m=>m===parts[0]),yr=parseInt(parts[1]);
  const k=getExpCatKey(yr,mo);
  const ec={...(r.expense_categories||{})};
  if(!ec[k])ec[k]={};
  if(amount>0)ec[k][cat]=amount;
  else delete ec[k][cat];
  r.expense_categories=ec;
  schedSave();
}

function updDayExpCat(y,m,d,cat,amount){
  const r=getR();if(!r)return;
  const k='expcat:'+dayKey(y,m,d);
  const ec={...(r.expense_categories||{})};
  if(!ec[k])ec[k]={};
  if(amount>0)ec[k][cat]=amount;
  else delete ec[k][cat];
  r.expense_categories=ec;
  schedSave();
}

function calcExpBreakdown(r){
  const ec=r.expense_categories||{};
  const totals={};
  Object.values(ec).forEach(dayOrMonth=>{
    Object.entries(dayOrMonth).forEach(([cat,amt])=>{
      totals[cat]=(totals[cat]||0)+amt;
    });
  });
  return totals;
}

function renderExpBreakdown(r,p1){
  const totals=calcExpBreakdown(r);
  const entries=Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  if(!entries.length)return`<div class="empty">No expense categories logged yet. Add categories when entering expenses in Overview or Calendar.</div>`;
  const grand=entries.reduce((s,[,v])=>s+v,0);
  return`<div id="exp-chart-wrap" style="display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1.5rem;overflow:visible">
    <div style="position:relative;width:160px;height:160px;flex-shrink:0"><canvas id="cExpCat" role="img" aria-label="Expense categories"></canvas></div>
    <div style="flex:1;min-width:200px">
      ${entries.map(([cat,amt],i)=>{
        const ci=EXP_CATS.indexOf(cat);
        const color=ci>=0?EXP_COLORS[ci]:EXP_COLORS[EXP_COLORS.length-1];

function getInvoiceStatus(inv){if(inv.status==='paid')return'paid';const t=new Date();t.setHours(0,0,0,0);const d=new Date(inv.due_date+'T00:00:00');return d<t?'overdue':'unpaid';}
function invDayKey(dateStr){const p=dateStr.split('-');return dayKey(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));}
function syncInvoiceProjections(invoices,daily_data){
  // Remove all existing invoice projection keys (prefixed with inv:)
  const nd={};
  Object.entries(daily_data||{}).forEach(([k,v])=>{if(!k.startsWith('inv:'))nd[k]=v;});
  // Re-add projections for all unpaid/overdue invoices grouped by due_date
  invoices.filter(i=>i.status!=='paid').forEach(inv=>{
    const k='inv:'+invDayKey(inv.due_date);
    if(!nd[k])nd[k]=[];
    nd[k].push({id:inv.id,client:inv.client,amount:inv.amount});
  });
  return nd;
}
function addInvoice(){
  const cl=document.getElementById('inv-client')?.value.trim(),am=Number(document.getElementById('inv-amount')?.value)||0,desc=document.getElementById('inv-desc')?.value.trim()||'',id=document.getElementById('inv-date')?.value,dd=document.getElementById('inv-due')?.value;
  if(!cl||!am||!id||!dd){alert('Please fill in client, amount, invoice date and due date.');return;}

  const invoices=[...(r.invoices||[]),{id:uid(),client:cl,amount:am,description:desc,invoice_date:id,due_date:dd,paid_date:null,status:'unpaid'}];

}

function calcAvgCollection(invs){const paid=invs.filter(i=>i.status==='paid'&&i.paid_date&&i.invoice_date);if(!paid.length)return null;const tot=paid.reduce((s,i)=>{const a=new Date(i.invoice_date+'T00:00:00'),b=new Date(i.paid_date+'T00:00:00');return s+Math.max(0,(b-a)/(86400000));},0);return Math.round(tot/paid.length);}

const MS_KEY='nd_milestones';
function getSeenMS(){try{return new Set(JSON.parse(localStorage.getItem(MS_KEY)||'[]'));}catch{return new Set();}}
function markSeenMS(key){const s=getSeenMS();s.add(key);localStorage.setItem(MS_KEY,JSON.stringify([...s]));}
function dismissMS(key){markSeenMS(key);render();}
function checkMilestones(r){
  const result=[],seen=getSeenMS();
  if(!r.month_data.length)return result;
  const labels=getLabels(r.start_month,r.start_year,r.duration);
  const revs=r.month_data.map(m=>m.revenue);
  const maxRev=Math.max(...revs);
  const lastIdx=revs.length-1;
  const lastRev=revs[lastIdx];
  const lastLabel=labels[lastIdx]?.label||'';
  if(lastRev>0&&lastRev>=maxRev&&revs.length>1){const k='best_'+lastLabel;if(!seen.has(k))result.push({key:k,emoji:'🚀',msg:`${lastLabel} is your best month ever at ${fmt(lastRev)}!`});}
  if(r.goals.revenue>0&&lastRev>=r.goals.revenue){const k='goal_'+lastLabel;if(!seen.has(k))result.push({key:k,emoji:'🎯',msg:`You hit your ${fmt(r.goals.revenue)}/mo goal in ${lastLabel}!`});}
  let streak=0;for(let i=lastIdx;i>=0;i--){if(r.goals.revenue>0&&revs[i]>=r.goals.revenue)streak++;else break;}
  if(streak>=3){const k='streak_'+streak+'_'+lastLabel;if(!seen.has(k))result.push({key:k,emoji:'🔥',msg:`${streak} months in a row hitting your goal. You're on a streak!`});}
  return result;
}

function doCharts(r,agg,compR,compAgg,sl,p1,p2,CLR){
  const yFmt=v=>'$'+Math.round(v/1000)+'k';
  const o=getChartOpts(yFmt);
  const oF=getChartOpts(v=>fmt(v),v=>fmt(v));

  if(tab==='overview'){
    mkChart('cRev',{type:'line',data:{labels:sl,datasets:[{label:'Revenue',data:r.month_data.map(m=>m.revenue),borderColor:p1,borderWidth:1.5,pointRadius:0,tension:.4},{label:'Expenses',data:r.month_data.map(m=>m.expenses),borderColor:p2,borderWidth:1.5,pointRadius:0,tension:.4}]},options:o});
    mkChart('cProfit',{type:'bar',data:{labels:sl,datasets:[{label:'Net profit',data:r.month_data.map(m=>m.revenue-m.expenses),backgroundColor:r.month_data.map(m=>m.revenue-m.expenses>=0?p1:p2),borderRadius:2}]},options:o});
  }

  if(tab==='calendar'){
    const dim=new Date(calYear,calMonth+1,0).getDate();
    const days=Array.from({length:dim},(_,i)=>i+1);
    const today=todayMidnight();
    const actRevs=days.map(d=>{const k=dayKey(calYear,calMonth,d),dt=r.daily_data?.[k];return(!dt||dt.projected)?0:(dt.revenue||0);});
    const actExps=days.map(d=>{const k=dayKey(calYear,calMonth,d),dt=r.daily_data?.[k];return(!dt||dt.projected)?0:(dt.expenses||0);});
    const projRevs=days.map(d=>{const k=dayKey(calYear,calMonth,d),dt=r.daily_data?.[k];return(dt?.projected)?(dt.revenue||0):0;});
    const projExps=days.map(d=>{const k=dayKey(calYear,calMonth,d),dt=r.daily_data?.[k];return(dt?.projected)?(dt.expenses||0):0;});
    let run=0;
    const cum=days.map((_,i)=>{run+=(actRevs[i]-actExps[i])+(projRevs[i]-projExps[i]);return run;});
    const dayLabels=days.map(String);
    const hasChart=actRevs.some(v=>v>0)||actExps.some(v=>v>0)||projRevs.some(v=>v>0)||projExps.some(v=>v>0);
    const dailyOpts={...getChartOpts(v=>'$'+Math.round(v/1000)+'k'),scales:{...getChartOpts(v=>'$'+Math.round(v/1000)+'k').scales,x:{...getChartOpts(v=>'$'+Math.round(v/1000)+'k').scales.x,ticks:{...getChartOpts(v=>'$'+Math.round(v/1000)+'k').scales.x.ticks,maxTicksLimit:15}}}};
    if(hasChart){
      mkChart('cCalDaily',{type:'bar',data:{labels:dayLabels,datasets:[{label:'Actual revenue',data:actRevs,backgroundColor:p1,borderRadius:2},{label:'Actual expenses',data:actExps,backgroundColor:p2,borderRadius:2},{label:'Projected revenue',data:projRevs,backgroundColor:'rgba(202,138,4,0.6)',borderRadius:2},{label:'Projected expenses',data:projExps,backgroundColor:'rgba(202,138,4,0.35)',borderRadius:2}]},options:dailyOpts});
      const cumColor=cum[cum.length-1]>=0?'#22C55E':'#EF4444';
      const cumOpts={...getChartOpts(v=>'$'+Math.round(v/1000)+'k'),scales:{...getChartOpts(v=>'$'+Math.round(v/1000)+'k').scales,x:{...getChartOpts(v=>'$'+Math.round(v/1000)+'k').scales.x,ticks:{...getChartOpts(v=>'$'+Math.round(v/1000)+'k').scales.x.ticks,maxTicksLimit:15}}}};
      mkChart('cCalCum',{type:'line',data:{labels:dayLabels,datasets:[{label:'Cumulative profit',data:cum,borderColor:cumColor,borderWidth:1.5,pointRadius:0,tension:.3,fill:true,backgroundColor:cum[cum.length-1]>=0?'rgba(34,197,94,0.06)':'rgba(239,68,68,0.06)'}]},options:cumOpts});
    }
  }

  if(tab==='clients'&&r.clients.length){
    const pieOpts={...o,cutout:'65%',plugins:{...o.plugins,tooltip:{...o.plugins.tooltip,callbacks:{label:ctx=>` ${ctx.label}: ${fmt(ctx.parsed)}`}}}};
    mkChart('cClPie',{type:'doughnut',data:{labels:r.clients.map(c=>c.name),datasets:[{data:r.clients.map(c=>c.revenue),backgroundColor:CLR.slice(0,r.clients.length),borderWidth:0,hoverOffset:4}]},options:pieOpts});
    mkChart('cClBar',{type:'bar',data:{labels:r.clients.map(c=>c.name),datasets:[{label:'Revenue',data:r.clients.map(c=>c.revenue),backgroundColor:CLR.slice(0,r.clients.length),borderRadius:2}]},options:oF});
  }

  if(tab==='tools'&&isPremium()){
    const expTotals=calcExpBreakdown(r);
    const expEntries=Object.entries(expTotals).sort((a,b)=>b[1]-a[1]);
    if(expEntries.length){
      const expColors=expEntries.map(([cat])=>{const ci=EXP_CATS.indexOf(cat);return ci>=0?EXP_COLORS[ci]:EXP_COLORS[EXP_COLORS.length-1];});
      mkChart('cExpCat',{type:'doughnut',data:{labels:expEntries.map(([cat])=>cat),datasets:[{data:expEntries.map(([,v])=>v),backgroundColor:expColors,borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false},tooltip:{enabled:false,external:function(ctx){let el=document.getElementById('exp-tooltip');if(!el){el=document.createElement('div');el.id='exp-tooltip';el.style.cssText='position:fixed;z-index:9999;padding:7px 11px;background:rgba(26,26,34,0.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.08);border-radius:7px;font-size:12px;color:#EEEEF2;pointer-events:none;font-family:Space Grotesk,sans-serif;white-space:nowrap';document.body.appendChild(el);}const{chart,tooltip}=ctx;if(tooltip.opacity===0){el.style.display='none';return;}const{offsetLeft:x,offsetTop:y}=chart.canvas;const item=tooltip.dataPoints?.[0];if(!item)return;el.innerHTML=`<span style='font-weight:600'>${item.label}</span>: ${fmt(item.parsed)}<br><span style='color:#72728A;font-size:11px'>${chart.data.datasets[0].data.reduce((a,b)=>a+b,0)>0?Math.round(item.parsed/chart.data.datasets[0].data.reduce((a,b)=>a+b,0)*100):0}% of total</span>`;el.style.display='block';const mx=ctx.chart._lastEvent?.native?.clientX||0,my=ctx.chart._lastEvent?.native?.clientY||0;el.style.left=(mx+14)+'px';el.style.top=(my-10)+'px';}}}}});
    }
  }

  if(tab==='goals'){
    mkChart('cGoal',{type:'bar',data:{labels:sl,datasets:[{label:'Revenue',data:r.month_data.map(m=>m.revenue),backgroundColor:p1,borderRadius:2},{label:'Goal',data:r.month_data.map(()=>r.goals.revenue),backgroundColor:p2,borderRadius:2}]},options:o});
  }

  if(tab==='compare'&&compR){
    const ml=Math.max(r.duration,compR.duration);
    mkChart('cCmp',{type:'line',data:{labels:Array.from({length:ml},(_,i)=>`Mo ${i+1}`),datasets:[{label:r.name,data:Array.from({length:ml},(_,i)=>r.month_data[i]?.revenue??null),borderColor:p1,borderWidth:1.5,pointRadius:0,tension:.4,spanGaps:true},{label:compR.name,data:Array.from({length:ml},(_,i)=>compR.month_data[i]?.revenue??null),borderColor:p2,borderWidth:1.5,pointRadius:0,tension:.4,spanGaps:true}]},options:o});
  }
}

// ACTIONS
function switchR(id){activeId=id;activeMonth=0;compareId=null;render();}
function switchTab(t){tab=t;showMonthPicker=false;showInvoiceForm=false;payingInvoiceId=null;editingInvoiceId=null;render();}
function setAM(i){activeMonth=i;render();}
function setCmp(id){compareId=id;render();}
function toggleShare(){showShare=!showShare;render();}
function toggleTheme(){showTheme=!showTheme;render();}
function toggleImport(){showImport=!showImport;if(showImport){showShare=false;showTheme=false;importStep='upload';importPreview=null;}render();}
function setDur(d){const r=getR(),cur=r.month_data,nd=d>cur.length?[...cur,...Array.from({length:d-cur.length},()=>({...DEF}))]:cur.slice(0,d);if(activeMonth>=d)activeMonth=d-1;updR({duration:d,month_data:nd});}
function updMD(i,f,v){const r=getR(),md=[...r.month_data];md[i]={...md[i],[f]:f==='notes'?v:f==='recurring'?Boolean(v):Number(v)||0};updR({month_data:md});}
function addClient(){const n=document.getElementById('cn')?.value.trim(),rev=Number(document.getElementById('cr')?.value)||0;if(!n)return;const r=getR();updR({clients:[...r.clients,{id:uid(),name:n,revenue:rev}]});}
function rmClient(id){const r=getR();updR({clients:r.clients.filter(c=>c.id!==id)});}
function saveKey(){const k=document.getElementById('api-input')?.value.trim();if(!k)return;localStorage.setItem('nd_api_key',k);render();}

async function genInsights(){const r=getR(),key=localStorage.getItem('nd_api_key');if(!key)return;const labels=getLabels(r.start_month,r.start_year,r.duration),agg=calcAgg(r),{totRev,netP,pMgn,effR}=agg,btn=document.getElementById('gen-btn'),out=document.getElementById('ins-out');if(btn){btn.disabled=true;btn.textContent='Analyzing...';}if(out)out.innerHTML='<div class="ib">Analyzing your data...</div>';const sum=r.month_data.map((m,i)=>`${labels[i]?.label}: Revenue $${m.revenue}, Expenses $${m.expenses}, Hours ${m.hours}, Projects ${m.projects}${m.notes?', Note: '+m.notes:''}`).join('\n'),cSum=r.clients.length?'\nClients: '+r.clients.map(c=>`${c.name} $${c.revenue}`).join(', '):'';const profCtx=buildProfileCtx(r);const sys=profCtx?`You are a sharp business analyst. This client has provided their business profile:\n${profCtx}\n\nUse this context to tailor every insight specifically to their type of business, typical pricing norms, cost structures, and growth patterns for that industry. Return exactly 6 numbered, specific, actionable insights. Be direct, data-driven, include actual numbers. Max 2 sentences each. No preamble.`:'You are a sharp business analyst. Return exactly 6 numbered, specific, actionable insights. Be direct, data-driven, include actual numbers. Max 2 sentences each. No preamble.';try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:sys,messages:[{role:'user',content:`Business: ${r.biz_name}\nPeriod: ${labels[0]?.label}–${labels[labels.length-1]?.label}\n${sum}${cSum}\nGoal: $${r.goals.revenue}/mo\nTotals: Revenue ${fmt(totRev)}, Profit ${fmt(netP)}, Margin ${pct(pMgn)}, Rate ${fmtR(effR)}`}]})});const d=await res.json();if(d.error)throw new Error(d.error.message);const text=d.content?.map(b=>b.text||'').join('')||'No insights returned.';updR({insights:text});}catch(e){const msg=e.message||'Unknown error';if(out)out.innerHTML=`<div class="ib" style="color:var(--err)">Error: ${msg}. If this says invalid api key, clear your key and re-enter it.</div>`;if(btn){btn.disabled=false;btn.textContent='Generate insights →';}}}

async function importReport(){const code=document.getElementById('load-input')?.value.trim();if(!code)return;try{const d=JSON.parse(atob(code));const nr={...d,id:uid(),db_id:null,name:(d.name||'Imported')+' (imported)',insights:'',daily_data:{},month_data:(d.month_data||[]).map(m=>({...DEF,...m}))};reports.push(nr);activeId=nr.id;await saveToDB(nr);showShare=false;render();}catch{alert('Invalid share code.');}}

async function exportPDF(){const r=getR(),btn=document.getElementById('pdf-btn');if(btn){btn.textContent='Exporting...';btn.disabled=true;}const pal=PALETTES[themePalette]||PALETTES.nova;const[r1,g1,b1]=h2r(pal.p1);try{if(!window.jspdf)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});const{jsPDF}=window.jspdf,doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const W=210,mg=18,cW=W-mg*2,labels=getLabels(r.start_month,r.start_year,r.duration),agg=calcAgg(r),{totRev,netP,pMgn,effR,avgR,totProj}=agg,period=`${labels[0]?.label} – ${labels[labels.length-1]?.label}`;doc.setFillColor(r1,g1,b1);doc.rect(0,0,W,40,'F');doc.setTextColor(255,255,255);doc.setFontSize(20);doc.setFont('helvetica','bold');doc.text(r.biz_name||'Freelance Business',mg,17);doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text(`Analytics Report · ${r.name}`,mg,25);doc.text(period,mg,32);doc.text(`${uname} · ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}`,W-mg,32,{align:'right'});let y=50;doc.setTextColor(28,28,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Key performance indicators',mg,y);y+=8;const kI=[['Total Revenue',fmt(totRev)],['Net Profit',fmt(netP)],['Profit Margin',pct(pMgn)],['Effective Rate',fmtR(effR)],['Avg Monthly',fmt(avgR)],['Total Projects',String(totProj)]],cw2=(cW-4)/2;kI.forEach(([lb,vl],i)=>{const col=i%2,row=Math.floor(i/2),x=mg+col*(cw2+4),ky=y+row*18;doc.setFillColor(240,240,245);doc.roundedRect(x,ky,cw2,15,2,2,'F');doc.setTextColor(130,130,150);doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.text(lb.toUpperCase(),x+4,ky+6);doc.setTextColor(20,20,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text(vl,x+4,ky+12.5);});y+=Math.ceil(kI.length/2)*18+14;doc.setTextColor(28,28,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Monthly breakdown',mg,y);y+=7;const tC=['Month','Revenue','Expenses','Net Profit','Hours','Rate/Hr'],tW=[22,28,28,28,20,20];const sw=tW.map(w=>w*cW/tW.reduce((a,b)=>a+b,0));doc.setFillColor(r1,g1,b1);doc.rect(mg,y,cW,8,'F');doc.setTextColor(255,255,255);doc.setFontSize(7.5);doc.setFont('helvetica','bold');let cx=mg;tC.forEach((c,i)=>{doc.text(c,cx+2,y+5.5);cx+=sw[i];});y+=8;r.month_data.forEach((m,idx)=>{const pr=m.revenue-m.expenses,r2=m.hours>0?Math.round(m.revenue/m.hours):0,cells=[labels[idx]?.short||'',fmt(m.revenue),fmt(m.expenses),fmt(pr),String(m.hours),`$${r2}`];if(idx%2===0){doc.setFillColor(248,248,252);doc.rect(mg,y,cW,7,'F');}doc.setTextColor(60,60,80);doc.setFontSize(7.5);doc.setFont('helvetica','normal');cx=mg;cells.forEach((c,i)=>{doc.text(String(c),cx+2,y+5);cx+=sw[i];});y+=7;});y+=12;if(r.clients.length){if(y>240){doc.addPage();y=20;}doc.setTextColor(28,28,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Client breakdown',mg,y);y+=7;const cCols=['Client','Revenue','% of Total'],cW2=[80,50,cW-130];doc.setFillColor(r1,g1,b1);doc.rect(mg,y,cW,8,'F');doc.setTextColor(255,255,255);doc.setFontSize(7.5);doc.setFont('helvetica','bold');cx=mg;cCols.forEach((c,i)=>{doc.text(c,cx+2,y+5.5);cx+=cW2[i];});y+=8;const cTot2=r.clients.reduce((s,c)=>s+c.revenue,0);r.clients.forEach((c,i)=>{if(i%2===0){doc.setFillColor(248,248,252);doc.rect(mg,y,cW,7,'F');}doc.setTextColor(60,60,80);doc.setFontSize(7.5);doc.setFont('helvetica','normal');cx=mg;[c.name,fmt(c.revenue),cTot2>0?(c.revenue/cTot2*100).toFixed(1)+'%':'0%'].forEach((t,i2)=>{doc.text(t,cx+2,y+5);cx+=cW2[i2];});y+=7;});y+=12;}if(r.insights){if(y>240){doc.addPage();y=20;}doc.setTextColor(28,28,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('AI business insights',mg,y);y+=8;doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(80,80,100);doc.splitTextToSize(r.insights,cW).forEach(line=>{if(y>272){doc.addPage();y=20;}doc.text(line,mg,y);y+=5;});}const pc=doc.internal.getNumberOfPages();for(let p=1;p<=pc;p++){doc.setPage(p);doc.setFillColor(r1,g1,b1);doc.rect(0,285,W,12,'F');doc.setTextColor(255,255,255);doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.text(`${r.biz_name} · ${r.name}`,mg,292);doc.text(`Page ${p} of ${pc}`,W-mg,292,{align:'right'});}doc.save((r.biz_name||'business').toLowerCase().replace(/\s+/g,'-')+'.pdf');}catch(e){console.error(e);}if(btn){btn.textContent='Export PDF';btn.disabled=false;}}

window.addEventListener('load',async()=>{applyTheme(themeMode,themePalette);const{data:{session}}=await sb.auth.getSession();if(session?.user)await initApp(session.user);else{document.getElementById('auth-screen').style.display='flex';document.getElementById('name-wrap').style.display='none';}document.getElementById('loading').style.display='none';});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('auth-screen').style.display!=='none')handleAuth();if(e.key==='Escape'){if(showApiGuide){showApiGuide=false;render();}if(showMonthPicker){showMonthPicker=false;render();}}});
document.addEventListener('click',e=>{if(!e.target.closest('.tip-wrap'))document.querySelectorAll('.tip-box').forEach(el=>el.style.display='none');if(showMonthPicker&&!e.target.closest('.month-picker')&&!e.target.closest('[onclick*="toggleMonthPicker"]')){showMonthPicker=false;render();}});
