<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myNovaDash — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090C;--bg-s:#0F0F14;--bg-c:#141418;--bg-e:#1A1A22;
  --bd:rgba(255,255,255,0.055);--bd-m:rgba(255,255,255,0.1);
  --t1:#EEEEF2;--t2:#72728A;--t3:#3A3A50;
  --blue:#2563EB;--blue-h:#1D4ED8;--blue-s:rgba(37,99,235,0.12);--blue-b:rgba(37,99,235,0.25);
}
body{font-family:'Space Grotesk',sans-serif;color:var(--t1);background:var(--bg);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
.ld-logo{font-size:22px;font-weight:700;letter-spacing:-.5px}
.ld-logo span{color:var(--blue)}
#auth-screen{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:2rem}
.auth-box{background:var(--bg-c);border:1px solid var(--bd);border-radius:12px;padding:2.5rem;width:100%;max-width:380px}
.auth-logo{font-size:20px;font-weight:700;letter-spacing:-.5px;margin-bottom:.375rem}
.auth-logo span{color:var(--blue)}
.auth-sub{font-size:13px;color:var(--t2);margin-bottom:2rem}
.al{display:block;font-size:10px;color:var(--t3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.ai{width:100%;padding:11px 13px;border-radius:7px;border:1px solid var(--bd);background:var(--bg-s);color:var(--t1);font-size:14px;outline:none;font-family:'Space Grotesk',sans-serif;margin-bottom:12px;transition:border-color .2s}
.ai:focus{border-color:var(--blue)}
.ai::placeholder{color:var(--t3)}
.auth-btn{width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:background .2s}
.auth-btn:hover{background:var(--blue-h)}
.auth-switch{text-align:center;margin-top:1.25rem;font-size:13px;color:var(--t2)}
.auth-switch a{color:var(--blue);cursor:pointer}
.auth-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#FCA5A5;padding:9px 13px;border-radius:7px;font-size:13px;margin-bottom:12px;display:none}
#app{display:none;flex-direction:column;min-height:100vh}
nav{background:var(--bg-s);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100}
.nav-logo{font-size:16px;font-weight:700;color:var(--t1);text-decoration:none;letter-spacing:-.4px}
.nav-logo span{color:var(--blue)}
.nav-right{display:flex;gap:6px}
.nb{padding:5px 11px;font-size:12px;border-radius:6px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--t2);font-family:'Space Grotesk',sans-serif;transition:all .2s;font-weight:500}
.nb:hover{background:var(--bg-e);color:var(--t1);border-color:var(--bd-m)}
.main{flex:1;padding:1.5rem;max-width:1020px;margin:0 auto;width:100%}
.rbar{background:var(--bg-c);border:1px solid var(--bd);border-radius:8px;padding:.6rem 1rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;font-weight:500;flex-shrink:0}
.chip{padding:3px 10px;font-size:12px;cursor:pointer;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--t2);font-family:'Space Grotesk',sans-serif;transition:all .2s;font-weight:500}
.chip.active{background:var(--blue-s);border-color:var(--blue-b);color:#60A5FA}
.chip:hover:not(.active){background:var(--bg-e);color:var(--t1)}
.chip.red{color:#EF4444;border-color:rgba(239,68,68,.2)}
.rni{margin-left:auto;font-size:12px;padding:3px 8px;border:1px solid var(--bd);border-radius:5px;color:var(--t1);font-family:'Space Grotesk',sans-serif;width:130px;text-align:right;background:transparent}
.rni:focus{outline:none;border-color:var(--bd-m)}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:1.25rem}
.tab-btn{padding:10px 16px;font-size:13px;cursor:pointer;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--t2);font-family:'Space Grotesk',sans-serif;transition:all .2s;margin-bottom:-1px;font-weight:500}
.tab-btn.active{color:var(--t1);border-bottom-color:var(--blue)}
.card{background:var(--bg-c);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1rem}
.ct{font-size:10px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:1rem}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;margin-bottom:1rem;background:var(--bd);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.kpi{background:var(--bg-c);padding:1rem 1.25rem}
.kpi-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;font-weight:500}
.kpi-v{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;line-height:1}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.cw{position:relative;height:180px}
.mchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.ml{font-size:10px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.ig{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ig label{display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:500}
.ig input{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--t1);background:var(--bg-s)}
.ig input:focus{outline:none;border-color:var(--bd-m)}
.pr{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.pr select{padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;font-family:'Space Grotesk',sans-serif;color:var(--t1);background:var(--bg-s)}
.pr select:focus{outline:none;border-color:var(--bd-m)}
.ih{display:flex;justify-content:space-between;align-items:flex-start}
.gb{padding:7px 14px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;flex-shrink:0;margin-left:12px;transition:background .2s}
.gb:hover{background:var(--blue-h)}
.gb:disabled{opacity:.5;cursor:default}
.ib{background:var(--bg-s);border:1px solid var(--bd);border-radius:7px;padding:14px 16px;font-size:13px;line-height:1.8;color:var(--t2);white-space:pre-wrap;margin-top:14px}
.an{background:rgba(234,179,8,.07);border:1px solid rgba(234,179,8,.15);border-radius:7px;padding:12px 14px;font-size:13px;color:#CA8A04;margin-top:14px}
.an a{color:#EAB308;font-weight:600}
.cr{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.cr:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.cd{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.gbw{margin-bottom:16px}
.gbh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;color:var(--t2)}
.gbb{height:3px;background:var(--bg-e);border-radius:2px;overflow:hidden}
.gbf{height:100%;border-radius:2px;transition:width .4s}
.cc{border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;background:var(--bg-c);margin-bottom:10px}
.leg{display:flex;gap:14px;font-size:10px;color:var(--t3);margin-bottom:12px;flex-wrap:wrap;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.ld{width:6px;height:6px;border-radius:1px;display:inline-block;margin-right:5px}
.btn{padding:7px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;border:1px solid var(--bd);background:transparent;color:var(--t2);transition:all .2s}
.btn:hover{background:var(--bg-e);color:var(--t1);border-color:var(--bd-m)}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.blue:hover{background:var(--blue-h)}
.btn.sm{padding:4px 9px;font-size:11px}
.sp{background:var(--bg-s);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1rem}
.sp textarea{width:100%;font-size:10px;height:48px;font-family:'JetBrains Mono',monospace;resize:none;border:1px solid var(--bd);border-radius:5px;padding:8px;margin-bottom:10px;box-sizing:border-box;background:var(--bg-c);color:var(--t2)}
.empty{text-align:center;padding:2.5rem;color:var(--t3);font-size:13px}
.di{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;color:var(--t1);background:var(--bg-s);font-family:'Space Grotesk',sans-serif}
.di:focus{outline:none;border-color:var(--bd-m)}
.nim{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;color:var(--t1);background:var(--bg-s);font-family:'JetBrains Mono',monospace}
.nim:focus{outline:none;border-color:var(--bd-m)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg-s)}::-webkit-scrollbar-thumb{background:var(--bg-e);border-radius:3px}
@media(max-width:600px){.cg{grid-template-columns:1fr}.ig{grid-template-columns:repeat(2,1fr)}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="loading"><div class="ld-logo">my<span>Nova</span>Dash</div></div>
<div id="auth-screen" style="display:none">
  <div class="auth-box">
    <div class="auth-logo">my<span>Nova</span>Dash</div>
    <p class="auth-sub" id="auth-sub">Sign in to your account</p>
    <div class="auth-err" id="auth-error"></div>
    <div id="name-wrap" style="display:none"><label class="al">Your name</label><input class="ai" id="auth-name" type="text" placeholder="Your name"></div>
    <label class="al">Email</label><input class="ai" id="auth-email" type="email" placeholder="you@email.com">
    <label class="al">Password</label><input class="ai" id="auth-pass" type="password" placeholder="••••••••">
    <button class="auth-btn" id="auth-btn" onclick="handleAuth()">Sign in</button>
    <div class="auth-switch" id="auth-switch">Don't have an account? <a onclick="toggleAuth()">Sign up</a></div>
  </div>
</div>
<div id="app" style="display:none;flex-direction:column;min-height:100vh">
  <nav>
    <a class="nav-logo" href="#">my<span>Nova</span>Dash</a>
    <div class="nav-right">
      <button class="nb" onclick="toggleShare()">Share</button>
      <button class="nb" id="pdf-btn" onclick="exportPDF()">Export PDF</button>
      <button class="nb" onclick="doSignOut()">Sign out</button>
    </div>
  </nav>
  <div class="main"><div id="content"></div></div>
</div>
<script>
const SB_URL='https://nzccxsbhzovkqojyelxw.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56Y2N4c2Joem92a3FvanllbHh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTI5MDMsImV4cCI6MjA5NDI2ODkwM30.xraOqLGPoPPA0q4bPwzIoDUR3Xz9Kp-p9A7FuY8sRD4';
const sb=supabase.createClient(SB_URL,SB_KEY);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const YEARS=[2022,2023,2024,2025,2026];
const CLR=['#3B82F6','#7C3AED','#06B6D4','#6366F1','#8B5CF6','#0EA5E9'];
const DEF={revenue:5000,expenses:900,hours:120,clients:3,projects:4};
const fmt=n=>'$'+Math.round(n).toLocaleString();
const fmtR=n=>'$'+Math.round(n)+'/hr';
const pct=n=>n.toFixed(1)+'%';
const uid=()=>Math.random().toString(36).slice(2,9);
let user=null,uname='',reports=[],activeId=null,tab='overview',activeMonth=0,showShare=false,compareId=null,charts={},saveTimer=null,authMode='signin';
const getR=()=>reports.find(r=>r.id===activeId)||reports[0]||null;
const getLabels=(sm,sy,n)=>Array.from({length:n},(_,i)=>{const t=sm+i;return{label:`${MN[t%12]} ${sy+Math.floor(t/12)}`,short:MN[t%12]};});
const calcAgg=r=>{const md=r.month_data,tR=md.reduce((s,m)=>s+m.revenue,0),tE=md.reduce((s,m)=>s+m.expenses,0),tH=md.reduce((s,m)=>s+m.hours,0),tP=md.reduce((s,m)=>s+m.projects,0),nP=tR-tE;return{totRev:tR,totExp:tE,totHrs:tH,totProj:tP,netP:nP,pMgn:tR>0?nP/tR*100:0,effR:tH>0?tR/tH:0,avgR:tR/md.length};};
function makeReport(name='New Report'){return{id:uid(),db_id:null,name,biz_name:'My Freelance Business',start_month:0,start_year:2025,duration:6,month_data:Array.from({length:6},(_,i)=>({...DEF,revenue:[4200,3800,5100,4700,6200,5800][i]})),clients:[],goals:{revenue:6000,profit:4000},insights:''};}
function toggleAuth(){authMode=authMode==='signin'?'signup':'signin';document.getElementById('auth-sub').textContent=authMode==='signin'?'Sign in to your account':'Create your account';document.getElementById('auth-btn').textContent=authMode==='signin'?'Sign in':'Create account';document.getElementById('auth-switch').innerHTML=authMode==='signin'?"Don't have an account? <a onclick='toggleAuth()'>Sign up</a>":"Already have an account? <a onclick='toggleAuth()'>Sign in</a>";document.getElementById('name-wrap').style.display=authMode==='signup'?'block':'none';document.getElementById('auth-error').style.display='none';}
async function handleAuth(){const email=document.getElementById('auth-email').value.trim(),pass=document.getElementById('auth-pass').value,name=document.getElementById('auth-name').value.trim(),btn=document.getElementById('auth-btn'),err=document.getElementById('auth-error');if(!email||!pass){err.textContent='Please fill in all fields';err.style.display='block';return;}if(authMode==='signup'&&!name){err.textContent='Please enter your name';err.style.display='block';return;}btn.textContent='Loading...';btn.disabled=true;err.style.display='none';if(authMode==='signup'){const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name}}});if(error){err.textContent=error.message;err.style.display='block';btn.textContent='Create account';btn.disabled=false;return;}if(data.user)await initApp(data.user);else{err.textContent='Check your email to confirm your account.';err.style.display='block';btn.textContent='Create account';btn.disabled=false;}}else{const{data,error}=await sb.auth.signInWithPassword({email,password:pass});if(error){err.textContent='Invalid email or password';err.style.display='block';btn.textContent='Sign in';btn.disabled=false;return;}if(data.user)await initApp(data.user);}}
async function doSignOut(){await sb.auth.signOut();user=null;reports=[];activeId=null;destroyCharts();document.getElementById('app').style.display='none';document.getElementById('auth-screen').style.display='flex';document.getElementById('auth-email').value='';document.getElementById('auth-pass').value='';if(authMode!=='signin')toggleAuth();}
async function initApp(u){user=u;uname=u.user_metadata?.name||u.email.split('@')[0];await loadReports();document.getElementById('auth-screen').style.display='none';document.getElementById('app').style.display='flex';render();}
async function loadReports(){const{data,error}=await sb.from('reports').select('*').eq('user_id',user.id).order('created_at');if(error||!data||!data.length){const r=makeReport('H1 2025');reports=[r];activeId=r.id;await saveToDB(r);}else{reports=data.map(d=>({id:d.id,db_id:d.id,name:d.name,biz_name:d.biz_name,start_month:d.start_month,start_year:d.start_year,duration:d.duration,month_data:d.month_data,clients:d.clients||[],goals:d.goals||{revenue:6000,profit:4000},insights:d.insights||''}));activeId=reports[0].id;}}
async function saveToDB(r){const p={user_id:user.id,name:r.name,biz_name:r.biz_name,start_month:r.start_month,start_year:r.start_year,duration:r.duration,month_data:r.month_data,clients:r.clients,goals:r.goals,insights:r.insights};if(r.db_id){await sb.from('reports').update(p).eq('id',r.db_id);}else{const{data}=await sb.from('reports').insert(p).select().single();if(data){r.db_id=data.id;r.id=data.id;}}}
function schedSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const r=getR();if(r)saveToDB(r);},1000);}
function updR(u){const r=getR();if(!r)return;Object.assign(r,u);schedSave();render();}
async function newReport(){const r=makeReport('Report '+(reports.length+1));reports.push(r);activeId=r.id;await saveToDB(r);activeMonth=0;render();}
async function delReport(){const r=getR();if(!r||reports.length<=1)return;if(r.db_id)await sb.from('reports').delete().eq('id',r.db_id);reports=reports.filter(x=>x.id!==r.id);activeId=reports[0].id;render();}
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};}
function mkChart(id,cfg){if(charts[id]){try{charts[id].destroy();}catch(e){}}const c=document.getElementById(id);if(!c)return;charts[id]=new Chart(c,cfg);}
const CO={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{color:'#3A3A50',font:{family:'JetBrains Mono',size:10}},grid:{color:'rgba(255,255,255,0.03)'},border:{display:false}},x:{ticks:{color:'#3A3A50',font:{family:'Space Grotesk',size:10}},grid:{display:false},border:{display:false}}}};
function render(){
  destroyCharts();const r=getR();if(!r)return;
  const labels=getLabels(r.start_month,r.start_year,r.duration),agg=calcAgg(r);
  const{totRev,netP,pMgn,effR,avgR,totProj}=agg;
  const cTot=r.clients.reduce((s,c)=>s+c.revenue,0),onTarget=r.month_data.filter(m=>m.revenue>=r.goals.revenue).length;
  const compR=reports.find(x=>x.id===compareId),compAgg=compR?calcAgg(compR):null;
  const apiKey=localStorage.getItem('nd_api_key')||'',sl=labels.map(l=>l.short);
  let h='';
  h+=`<div class="rbar"><span class="rl">Reports</span>${reports.map(rep=>`<button class="chip ${rep.id===activeId?'active':''}" onclick="switchR('${rep.id}')">${rep.name}</button>`).join('')}<button class="chip" onclick="newReport()">+ New</button>${reports.length>1?`<button class="chip red" onclick="delReport()">Delete</button>`:''}<input class="rni" value="${r.name}" onchange="updR({name:this.value})" placeholder="Report name"></div>`;
  if(showShare){const code=btoa(JSON.stringify({name:r.name,biz_name:r.biz_name,start_month:r.start_month,start_year:r.start_year,duration:r.duration,month_data:r.month_data,clients:r.clients,goals:r.goals}));h+=`<div class="sp"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><p style="font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em">Share report</p><button class="btn sm" onclick="toggleShare()">Close</button></div><p style="font-size:12px;color:var(--t3);margin-bottom:10px">Copy this code and send it. Recipients paste it below to import.</p><textarea readonly onclick="this.select()">${code}</textarea><div style="display:flex;gap:8px"><input id="load-input" type="text" placeholder="Paste share code to import..." class="di" style="flex:1"><button class="btn blue sm" onclick="importReport()">Import</button></div></div>`;}
  h+=`<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem;gap:12px"><div style="flex:1;min-width:0"><input value="${r.biz_name}" onchange="updR({biz_name:this.value})" style="font-size:20px;font-weight:700;border:none;background:transparent;color:var(--t1);width:100%;padding:0;outline:none;font-family:'Space Grotesk',sans-serif;letter-spacing:-.5px"><p style="font-size:11px;color:var(--t3);margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:.06em">${uname}&nbsp;&nbsp;·&nbsp;&nbsp;${labels[0]?.label} — ${labels[labels.length-1]?.label}</p></div></div>`;
  h+=`<div class="tabs">${['overview','clients','goals','compare'].map(t=>`<button class="tab-btn ${tab===t?'active':''}" onclick="switchTab('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}</div>`;
  if(tab==='overview'){
    h+=`<div class="card"><p class="ct">Report period</p><div class="pr"><div><label style="display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:5px">Start month</label><select onchange="updR({start_month:parseInt(this.value)})">${MN.map((m,i)=>`<option value="${i}"${r.start_month===i?' selected':''}>${m}</option>`).join('')}</select></div><div><label style="display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:5px">Start year</label><select onchange="updR({start_year:parseInt(this.value)})">${YEARS.map(y=>`<option value="${y}"${r.start_year===y?' selected':''}>${y}</option>`).join('')}</select></div><div><label style="display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:5px">Duration</label><div style="display:flex;gap:5px">${[3,6,9,12].map(d=>`<button class="chip ${r.duration===d?'active':''}" onclick="setDur(${d})">${d}mo</button>`).join('')}</div></div></div></div>`;
    h+=`<div class="kpi-grid">${[{l:'Total revenue',v:fmt(totRev),c:'#3B82F6'},{l:'Net profit',v:fmt(netP),c:netP>=0?'#22C55E':'#EF4444'},{l:'Profit margin',v:pct(pMgn),c:pMgn>=20?'#22C55E':'#EF4444'},{l:'Effective rate',v:fmtR(effR),c:'#8B5CF6'},{l:'Avg monthly',v:fmt(avgR),c:'var(--t1)'},{l:'Total projects',v:String(totProj),c:'var(--t2)'}].map(k=>`<div class="kpi"><div class="kpi-l">${k.l}</div><div class="kpi-v" style="color:${k.c}">${k.v}</div></div>`).join('')}</div>`;
    h+=`<div class="cg"><div class="card"><p class="ct">Revenue vs expenses</p><div class="leg"><span><span class="ld" style="background:#3B82F6"></span>Revenue</span><span><span class="ld" style="background:#7C3AED"></span>Expenses</span></div><div class="cw"><canvas id="cRev" role="img" aria-label="Revenue vs expenses">Monthly data.</canvas></div></div><div class="card"><p class="ct">Monthly net profit</p><div class="cw"><canvas id="cProfit" role="img" aria-label="Net profit">Profit data.</canvas></div></div></div>`;
    h+=`<div class="card"><p class="ct">Edit monthly data</p><div class="mchips">${labels.map((l,i)=>`<button class="chip ${activeMonth===i?'active':''}" onclick="setAM(${i})">${l.short}</button>`).join('')}</div><p class="ml">${labels[activeMonth]?.label||''}</p><div class="ig">${[{f:'revenue',l:'Revenue ($)'},{f:'expenses',l:'Expenses ($)'},{f:'hours',l:'Hours'},{f:'clients',l:'Clients'},{f:'projects',l:'Projects'}].map(({f,l})=>`<div><label>${l}</label><input type="number" class="nim" value="${r.month_data[activeMonth]?.[f]??0}" onchange="updMD(${activeMonth},'${f}',this.value)"></div>`).join('')}</div></div>`;
    h+=`<div class="card"><div class="ih"><div><p style="font-size:13px;font-weight:600;color:var(--t1)">AI business insights</p><p style="font-size:11px;color:var(--t3);margin-top:2px;text-transform:uppercase;letter-spacing:.05em">Included in PDF export</p></div><button class="gb" id="gen-btn" onclick="genInsights()" ${!apiKey?'disabled':''}>${!apiKey?'Add API key below':'Generate insights →'}</button></div>${!apiKey?`<div class="an">Enter your Anthropic API key to enable AI insights. <a href="https://console.anthropic.com" target="_blank">Get one free →</a><div style="display:flex;gap:8px;margin-top:10px"><input id="api-input" type="password" placeholder="sk-ant-..." class="di" style="border-color:rgba(234,179,8,.2)"><button class="btn sm" onclick="saveKey()" style="background:#CA8A04;color:#fff;border-color:#CA8A04">Save</button></div></div>`:''} ${r.insights?`<div class="ib">${r.insights}</div>`:'<div id="ins-out"></div>'}</div>`;
  }
  if(tab==='clients'){
    h+=`<div class="card"><p class="ct">Add client</p><div style="display:flex;gap:10px;align-items:flex-end"><div style="flex:2"><label style="display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:5px">Name</label><input id="cn" type="text" placeholder="Acme Corp" class="di"></div><div style="flex:1"><label style="display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:5px">Revenue ($)</label><input id="cr" type="number" value="1000" class="nim"></div><button class="btn blue" onclick="addClient()">Add</button></div></div>`;
    if(!r.clients.length){h+=`<div class="card"><div class="empty">No clients yet. Add your first client above.</div></div>`;}
    else{h+=`<div class="cg"><div class="card"><p class="ct">Revenue by client</p><div class="leg">${r.clients.map((c,i)=>`<span><span class="ld" style="background:${CLR[i%CLR.length]}"></span>${c.name}</span>`).join('')}</div><div class="cw"><canvas id="cClPie" role="img" aria-label="Client pie">Client revenue.</canvas></div></div><div class="card"><p class="ct">Client list &nbsp;·&nbsp; <span style="font-family:'JetBrains Mono',monospace">${fmt(cTot)}</span></p>${r.clients.map((c,i)=>`<div class="cr"><span class="cd" style="background:${CLR[i%CLR.length]}"></span><span style="flex:1;font-size:13px">${c.name}</span><span style="font-size:13px;font-weight:600;font-family:'JetBrains Mono',monospace">${fmt(c.revenue)}</span><span style="font-size:11px;color:var(--t3);min-width:30px;text-align:right;font-family:'JetBrains Mono',monospace">${cTot>0?Math.round(c.revenue/cTot*100):0}%</span><button class="btn sm" onclick="rmClient('${c.id}')" style="color:#EF4444;border-color:rgba(239,68,68,.2)">×</button></div>`).join('')}</div></div><div class="card"><p class="ct">Revenue comparison</p><div class="cw"><canvas id="cClBar" role="img" aria-label="Client bar">Client comparison.</canvas></div></div>`;}
  }
  if(tab==='goals'){
    h+=`<div class="card"><p class="ct">Monthly targets</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label style="display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:5px">Revenue goal ($/mo)</label><input type="number" class="nim" value="${r.goals.revenue}" onchange="updR({goals:{...getR().goals,revenue:parseInt(this.value)||0}})"></div><div><label style="display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:5px">Profit goal ($/mo)</label><input type="number" class="nim" value="${r.goals.profit}" onchange="updR({goals:{...getR().goals,profit:parseInt(this.value)||0}})"></div></div></div>`;
    h+=`<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">${[{l:'Months on target',v:`${onTarget} / ${r.duration}`,c:'#22C55E'},{l:'Avg vs goal',v:r.goals.revenue>0?((avgR-r.goals.revenue)/r.goals.revenue*100).toFixed(1)+'%':'–',c:avgR>=r.goals.revenue?'#22C55E':'#EF4444'},{l:'Revenue goal',v:fmt(r.goals.revenue)+'/mo',c:'#3B82F6'}].map(k=>`<div class="kpi"><div class="kpi-l">${k.l}</div><div class="kpi-v" style="color:${k.c};font-size:18px">${k.v}</div></div>`).join('')}</div>`;
    h+=`<div class="card"><p class="ct">Revenue vs goal</p><div class="leg"><span><span class="ld" style="background:#3B82F6"></span>Revenue</span><span><span class="ld" style="background:#7C3AED"></span>Goal</span></div><div class="cw"><canvas id="cGoal" role="img" aria-label="Goals">Revenue vs goal.</canvas></div></div>`;
    h+=`<div class="card"><p class="ct">Month-by-month tracking</p>${r.month_data.map((m,i)=>{const ach=r.goals.revenue>0?Math.min(m.revenue/r.goals.revenue,1):1,over=m.revenue>=r.goals.revenue;return`<div class="gbw"><div class="gbh"><span style="font-weight:500">${labels[i]?.label||''}</span><span style="font-family:'JetBrains Mono',monospace;color:${over?'#22C55E':'#EF4444'}">${fmt(m.revenue)}&nbsp;${over?'✓':fmt(m.revenue-r.goals.revenue)+' to go'}</span></div><div class="gbb"><div class="gbf" style="width:${ach*100}%;background:${over?'#3B82F6':'#7C3AED'}"></div></div></div>`;}).join('')}</div>`;
  }
  if(tab==='compare'){
    h+=`<div class="card"><p class="ct">Compare <strong style="color:var(--t1)">${r.name}</strong> against:</p>${!reports.filter(x=>x.id!==activeId).length?'<p style="font-size:13px;color:var(--t3)">Create a second report to compare periods.</p>':`<div style="display:flex;gap:6px;flex-wrap:wrap">${reports.filter(x=>x.id!==activeId).map(rep=>`<button class="chip ${compareId===rep.id?'active':''}" onclick="setCmp('${rep.id}')">${rep.name}</button>`).join('')}</div>`}</div>`;
    if(compR&&compAgg){
      [{l:'Total revenue',a:totRev,b:compAgg.totRev,f:fmt},{l:'Net profit',a:netP,b:compAgg.netP,f:fmt},{l:'Profit margin',a:pMgn,b:compAgg.pMgn,f:v=>v.toFixed(1)+'%'},{l:'Effective rate',a:effR,b:compAgg.effR,f:fmtR}].forEach(({l,a,b,f})=>{const d=a-b,better=d>=0;h+=`<div class="cc"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:10px">${l}</div><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:10px;color:var(--t3);margin-bottom:4px">${r.name}</div><div style="font-size:20px;font-weight:700;color:#3B82F6;font-family:'JetBrains Mono',monospace">${f(a)}</div></div><div style="text-align:center"><div style="font-size:13px;font-weight:600;color:${better?'#22C55E':'#EF4444'};font-family:'JetBrains Mono',monospace">${better?'+':''}${f(d)}</div><div style="font-size:10px;color:var(--t3)">difference</div></div><div style="text-align:right"><div style="font-size:10px;color:var(--t3);margin-bottom:4px">${compR.name}</div><div style="font-size:20px;font-weight:700;color:#7C3AED;font-family:'JetBrains Mono',monospace">${f(b)}</div></div></div></div>`;});
      const ml=Math.max(r.duration,compR.duration);
      h+=`<div class="card"><p class="ct">Revenue comparison</p><div class="leg"><span><span class="ld" style="background:#3B82F6"></span>${r.name}</span><span><span class="ld" style="background:#7C3AED"></span>${compR.name}</span></div><div class="cw"><canvas id="cCmp" role="img" aria-label="Comparison">Revenue comparison.</canvas></div></div>`;
    }
  }
  document.getElementById('content').innerHTML=h;
  setTimeout(()=>doCharts(r,agg,compR,compAgg,sl),50);
}
function doCharts(r,agg,compR,compAgg,sl){
  const yK=cb=>({...CO,scales:{...CO.scales,y:{...CO.scales.y,ticks:{...CO.scales.y.ticks,callback:cb}}}});
  if(tab==='overview'){mkChart('cRev',{type:'line',data:{labels:sl,datasets:[{label:'Revenue',data:r.month_data.map(m=>m.revenue),borderColor:'#3B82F6',borderWidth:1.5,pointRadius:0,tension:.4},{label:'Expenses',data:r.month_data.map(m=>m.expenses),borderColor:'#7C3AED',borderWidth:1.5,pointRadius:0,tension:.4}]},options:yK(v=>'$'+Math.round(v/1000)+'k')});mkChart('cProfit',{type:'bar',data:{labels:sl,datasets:[{label:'Profit',data:r.month_data.map(m=>m.revenue-m.expenses),backgroundColor:r.month_data.map(m=>m.revenue-m.expenses>=0?'#3B82F6':'#7C3AED'),borderRadius:2}]},options:yK(v=>'$'+Math.round(v/1000)+'k')});}
  if(tab==='clients'&&r.clients.length){mkChart('cClPie',{type:'doughnut',data:{labels:r.clients.map(c=>c.name),datasets:[{data:r.clients.map(c=>c.revenue),backgroundColor:CLR.slice(0,r.clients.length),borderWidth:0,hoverOffset:4}]},options:{...CO,cutout:'65%'}});mkChart('cClBar',{type:'bar',data:{labels:r.clients.map(c=>c.name),datasets:[{label:'Revenue',data:r.clients.map(c=>c.revenue),backgroundColor:CLR.slice(0,r.clients.length),borderRadius:2}]},options:yK(v=>fmt(v))});}
  if(tab==='goals'){mkChart('cGoal',{type:'bar',data:{labels:sl,datasets:[{label:'Revenue',data:r.month_data.map(m=>m.revenue),backgroundColor:'#3B82F6',borderRadius:2},{label:'Goal',data:r.month_data.map(()=>r.goals.revenue),backgroundColor:'#7C3AED',borderRadius:2}]},options:yK(v=>'$'+Math.round(v/1000)+'k')});}
  if(tab==='compare'&&compR){const ml=Math.max(r.duration,compR.duration);mkChart('cCmp',{type:'line',data:{labels:Array.from({length:ml},(_,i)=>`Mo ${i+1}`),datasets:[{label:r.name,data:Array.from({length:ml},(_,i)=>r.month_data[i]?.revenue??null),borderColor:'#3B82F6',borderWidth:1.5,pointRadius:0,tension:.4,spanGaps:true},{label:compR.name,data:Array.from({length:ml},(_,i)=>compR.month_data[i]?.revenue??null),borderColor:'#7C3AED',borderWidth:1.5,pointRadius:0,tension:.4,spanGaps:true}]},options:yK(v=>'$'+Math.round(v/1000)+'k')});}
}
function switchR(id){activeId=id;activeMonth=0;compareId=null;render();}
function switchTab(t){tab=t;render();}
function setAM(i){activeMonth=i;render();}
function setCmp(id){compareId=id;render();}
function toggleShare(){showShare=!showShare;render();}
function setDur(d){const r=getR(),cur=r.month_data,nd=d>cur.length?[...cur,...Array.from({length:d-cur.length},()=>({...DEF}))]:cur.slice(0,d);if(activeMonth>=d)activeMonth=d-1;updR({duration:d,month_data:nd});}
function updMD(i,f,v){const r=getR(),md=[...r.month_data];md[i]={...md[i],[f]:Number(v)||0};updR({month_data:md});}
function addClient(){const n=document.getElementById('cn')?.value.trim(),rev=Number(document.getElementById('cr')?.value)||0;if(!n)return;const r=getR();updR({clients:[...r.clients,{id:uid(),name:n,revenue:rev}]});}
function rmClient(id){const r=getR();updR({clients:r.clients.filter(c=>c.id!==id)});}
function saveKey(){const k=document.getElementById('api-input')?.value.trim();if(!k)return;localStorage.setItem('nd_api_key',k);render();}
async function genInsights(){const r=getR(),key=localStorage.getItem('nd_api_key');if(!key)return;const labels=getLabels(r.start_month,r.start_year,r.duration),agg=calcAgg(r),{totRev,netP,pMgn,effR}=agg,btn=document.getElementById('gen-btn'),out=document.getElementById('ins-out');if(btn){btn.disabled=true;btn.textContent='Analyzing...';}if(out)out.innerHTML='<div class="ib">Analyzing your data...</div>';const sum=r.month_data.map((m,i)=>`${labels[i]?.label}: Revenue $${m.revenue}, Expenses $${m.expenses}, Hours ${m.hours}, Projects ${m.projects}`).join('\n'),cSum=r.clients.length?'\nClients: '+r.clients.map(c=>`${c.name} $${c.revenue}`).join(', '):'';try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:'You are a sharp freelance business analyst. Return exactly 6 numbered, specific, actionable insights. Be direct, data-driven, include actual numbers. Cover trends, efficiency, pricing, risk, growth. Max 2 sentences each. No preamble.',messages:[{role:'user',content:`Business: ${r.biz_name}\nPeriod: ${labels[0]?.label}–${labels[labels.length-1]?.label}\n${sum}${cSum}\nGoal: $${r.goals.revenue}/mo\nTotals: Revenue ${fmt(totRev)}, Profit ${fmt(netP)}, Margin ${pct(pMgn)}, Rate ${fmtR(effR)}`}]})});const d=await res.json();if(d.error)throw new Error(d.error.message);const text=d.content?.map(b=>b.text||'').join('')||'No insights returned.';updR({insights:text});}catch(e){if(out)out.innerHTML=`<div class="ib" style="color:#EF4444">Error: ${e.message}</div>`;if(btn){btn.disabled=false;btn.textContent='Generate insights →';}}}
async function importReport(){const code=document.getElementById('load-input')?.value.trim();if(!code)return;try{const d=JSON.parse(atob(code));const nr={...d,id:uid(),db_id:null,name:(d.name||'Imported')+' (imported)',insights:''};reports.push(nr);activeId=nr.id;await saveToDB(nr);showShare=false;render();}catch{alert('Invalid share code.');}}
async function exportPDF(){const r=getR(),btn=document.getElementById('pdf-btn');if(btn){btn.textContent='Exporting...';btn.disabled=true;}try{if(!window.jspdf)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});const{jsPDF}=window.jspdf,doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const W=210,mg=18,cW=W-mg*2,labels=getLabels(r.start_month,r.start_year,r.duration),agg=calcAgg(r),{totRev,netP,pMgn,effR,avgR,totProj}=agg,period=`${labels[0]?.label} – ${labels[labels.length-1]?.label}`;doc.setFillColor(9,9,12);doc.rect(0,0,W,40,'F');doc.setTextColor(238,238,242);doc.setFontSize(20);doc.setFont('helvetica','bold');doc.text(r.biz_name||'Freelance Business',mg,17);doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text(`Analytics Report · ${r.name}`,mg,25);doc.text(period,mg,32);doc.text(`${uname} · ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}`,W-mg,32,{align:'right'});let y=50;doc.setTextColor(28,28,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Key performance indicators',mg,y);y+=8;const kI=[['Total Revenue',fmt(totRev)],['Net Profit',fmt(netP)],['Profit Margin',pct(pMgn)],['Effective Rate',fmtR(effR)],['Avg Monthly',fmt(avgR)],['Total Projects',String(totProj)]],cw2=(cW-4)/2;kI.forEach(([lb,vl],i)=>{const col=i%2,row=Math.floor(i/2),x=mg+col*(cw2+4),ky=y+row*18;doc.setFillColor(20,20,24);doc.roundedRect(x,ky,cw2,15,2,2,'F');doc.setTextColor(58,58,80);doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.text(lb.toUpperCase(),x+4,ky+6);doc.setTextColor(238,238,242);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text(vl,x+4,ky+12.5);});y+=Math.ceil(kI.length/2)*18+14;doc.setTextColor(28,28,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Monthly breakdown',mg,y);y+=7;const tC=['Month','Revenue','Expenses','Net Profit','Hours','Rate/Hr','Goal','vs Goal'],tW=[20,25,25,25,18,18,20,19],sw=tW.map(w=>w*cW/tW.reduce((a,b)=>a+b,0));doc.setFillColor(37,99,235);doc.rect(mg,y,cW,8,'F');doc.setTextColor(255,255,255);doc.setFontSize(7.5);doc.setFont('helvetica','bold');let cx=mg;tC.forEach((c,i)=>{doc.text(c,cx+2,y+5.5);cx+=sw[i];});y+=8;r.month_data.forEach((m,idx)=>{const pr=m.revenue-m.expenses,r2=m.hours>0?Math.round(m.revenue/m.hours):0,vg=r.goals.revenue>0?((m.revenue-r.goals.revenue)/r.goals.revenue*100).toFixed(0)+'%':'–',cells=[labels[idx]?.short||'',fmt(m.revenue),fmt(m.expenses),fmt(pr),String(m.hours),`$${r2}`,fmt(r.goals.revenue),vg];if(idx%2===0){doc.setFillColor(20,20,24);doc.rect(mg,y,cW,7,'F');}doc.setTextColor(180,180,200);doc.setFontSize(7.5);doc.setFont('helvetica','normal');cx=mg;cells.forEach((c,i)=>{doc.text(String(c),cx+2,y+5);cx+=sw[i];});y+=7;});y+=12;if(r.clients.length){if(y>240){doc.addPage();y=20;}doc.setTextColor(28,28,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Client breakdown',mg,y);y+=7;const cCols=['Client','Revenue','% of Total'],cW2=[80,50,cW-130];doc.setFillColor(37,99,235);doc.rect(mg,y,cW,8,'F');doc.setTextColor(255,255,255);doc.setFontSize(7.5);doc.setFont('helvetica','bold');cx=mg;cCols.forEach((c,i)=>{doc.text(c,cx+2,y+5.5);cx+=cW2[i];});y+=8;const cTot=r.clients.reduce((s,c)=>s+c.revenue,0);r.clients.forEach((c,i)=>{if(i%2===0){doc.setFillColor(20,20,24);doc.rect(mg,y,cW,7,'F');}doc.setTextColor(180,180,200);doc.setFontSize(7.5);doc.setFont('helvetica','normal');cx=mg;[c.name,fmt(c.revenue),cTot>0?(c.revenue/cTot*100).toFixed(1)+'%':'0%'].forEach((t,i2)=>{doc.text(t,cx+2,y+5);cx+=cW2[i2];});y+=7;});y+=12;}if(r.insights){if(y>240){doc.addPage();y=20;}doc.setTextColor(28,28,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('AI business insights',mg,y);y+=8;doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(100,100,120);doc.splitTextToSize(r.insights,cW).forEach(line=>{if(y>272){doc.addPage();y=20;}doc.text(line,mg,y);y+=5;});}const pc=doc.internal.getNumberOfPages();for(let p=1;p<=pc;p++){doc.setPage(p);doc.setFillColor(9,9,12);doc.rect(0,285,W,12,'F');doc.setTextColor(58,58,80);doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.text(`${r.biz_name} · ${r.name}`,mg,292);doc.text(`Page ${p} of ${pc}`,W-mg,292,{align:'right'});}doc.save((r.biz_name||'freelance').toLowerCase().replace(/\s+/g,'-')+'-'+r.name.toLowerCase().replace(/\s+/g,'-')+'.pdf');}catch(e){console.error(e);}if(btn){btn.textContent='Export PDF';btn.disabled=false;}}
window.addEventListener('load',async()=>{const{data:{session}}=await sb.auth.getSession();if(session?.user)await initApp(session.user);else{document.getElementById('auth-screen').style.display='flex';document.getElementById('name-wrap').style.display='none';}document.getElementById('loading').style.display='none';});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('auth-screen').style.display!=='none')handleAuth();});
</script>
