<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090C;--bg-s:#0F0F14;--bg-c:#141418;--bg-e:#1A1A22;--bd:rgba(255,255,255,0.055);--bd-m:rgba(255,255,255,0.1);--t1:#EEEEF2;--t2:#72728A;--t3:#3A3A50;--p1:#2563EB;--p1h:#1D4ED8;--p1s:rgba(37,99,235,0.12);--p1b:rgba(37,99,235,0.25);--p2:#7C3AED;--ok:#22C55E;--err:#EF4444;--warn:#EAB308}
body{font-family:'Space Grotesk',sans-serif;color:var(--t1);background:var(--bg);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
#auth-screen{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:2rem}
.auth-box{background:var(--bg-c);border:1px solid var(--bd);border-radius:12px;padding:2.5rem;width:100%;max-width:380px}
.al{display:block;font-size:10px;color:var(--t3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.ai{width:100%;padding:11px 13px;border-radius:7px;border:1px solid var(--bd);background:var(--bg-s);color:var(--t1);font-size:14px;outline:none;font-family:'Space Grotesk',sans-serif;margin-bottom:12px;transition:border-color .2s}
.ai:focus{border-color:var(--p1)}.ai::placeholder{color:var(--t3)}
.auth-btn{width:100%;padding:11px;background:var(--p1);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:background .2s}
.auth-btn:hover{background:var(--p1h)}
.auth-switch{text-align:center;margin-top:1.25rem;font-size:13px;color:var(--t2)}
.auth-switch a{color:var(--p1);cursor:pointer}
.auth-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#FCA5A5;padding:9px 13px;border-radius:7px;font-size:13px;margin-bottom:12px;display:none}
#app{display:none;flex-direction:column;min-height:100vh}
nav{background:var(--bg-s);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100}
.nav-logo{text-decoration:none;display:flex;align-items:center;gap:10px}
.nav-right{display:flex;gap:6px}
.nb{padding:5px 11px;font-size:12px;border-radius:6px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--t2);font-family:'Space Grotesk',sans-serif;transition:all .2s;font-weight:500}
.nb:hover{background:var(--bg-e);color:var(--t1);border-color:var(--bd-m)}
.nb.active{background:var(--p1s);border-color:var(--p1b);color:var(--t1)}
.main{flex:1;padding:1.5rem;max-width:1020px;margin:0 auto;width:100%}
.theme-panel{background:var(--bg-c);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.mode-btns{display:flex;gap:6px;margin-top:8px}
.mode-btn{padding:6px 16px;font-size:12px;font-weight:600;border-radius:6px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--t2);font-family:'Space Grotesk',sans-serif;transition:all .2s}
.mode-btn.active{background:var(--p1);color:#fff;border-color:var(--p1)}
.mode-btn:hover:not(.active){background:var(--bg-e);color:var(--t1)}
.palette-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pal-swatch{width:36px;height:36px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .2s;display:flex;align-items:center;justify-content:center}
.pal-swatch:hover{transform:scale(1.1)}
.pal-inner{width:20px;height:20px;border-radius:4px}
.rbar{background:var(--bg-c);border:1px solid var(--bd);border-radius:8px;padding:.6rem 1rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{padding:3px 10px;font-size:12px;cursor:pointer;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--t2);font-family:'Space Grotesk',sans-serif;transition:all .2s;font-weight:500}
.chip.active{background:var(--p1s);border-color:var(--p1b);color:var(--t1)}
.chip:hover:not(.active){background:var(--bg-e);color:var(--t1)}
.chip.red{color:var(--err);border-color:rgba(239,68,68,.2)}
.rni{margin-left:auto;font-size:12px;padding:3px 8px;border:1px solid var(--bd);border-radius:5px;color:var(--t1);font-family:'Space Grotesk',sans-serif;width:130px;text-align:right;background:transparent}
.rni:focus{outline:none;border-color:var(--bd-m)}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:1.25rem;flex-wrap:wrap}
.tab-btn{padding:10px 14px;font-size:12px;cursor:pointer;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--t2);font-family:'Space Grotesk',sans-serif;transition:all .2s;margin-bottom:-1px;font-weight:500}
.tab-btn.active{color:var(--t1);border-bottom-color:var(--p1)}
.card{background:var(--bg-c);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1rem}
.ct{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:1rem}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;margin-bottom:1rem;background:var(--bd);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.kpi{background:var(--bg-c);padding:1rem 1.25rem}
.kpi-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;font-weight:600}
.kpi-v{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;line-height:1}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.cw{position:relative;height:180px}
.mchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.ig{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ig label{display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:600}
.pr{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.pr select{padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;font-family:'Space Grotesk',sans-serif;color:var(--t1);background:var(--bg-s)}
.pr select:focus{outline:none;border-color:var(--bd-m)}
.ih{display:flex;justify-content:space-between;align-items:flex-start}
.gb{padding:7px 14px;background:var(--p1);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;flex-shrink:0;margin-left:12px;transition:background .2s}
.gb:hover{background:var(--p1h)}.gb:disabled{opacity:.5;cursor:default}
.ib{background:var(--bg-s);border:1px solid var(--bd);border-radius:7px;padding:14px 16px;font-size:13px;line-height:1.8;color:var(--t2);white-space:pre-wrap;margin-top:14px}
.an{background:rgba(234,179,8,.07);border:1px solid rgba(234,179,8,.15);border-radius:7px;padding:12px 14px;font-size:13px;color:#CA8A04;margin-top:14px}
.an a{color:#EAB308;font-weight:600}
.cr{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.cr:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.cd{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.gbw{margin-bottom:16px}
.gbh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;color:var(--t2)}
.gbb{height:3px;background:var(--bg-e);border-radius:2px;overflow:hidden}
.gbf{height:100%;border-radius:2px;transition:width .4s}
.cc{border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;background:var(--bg-c);margin-bottom:10px}
.leg{display:flex;gap:14px;font-size:10px;color:var(--t3);margin-bottom:12px;flex-wrap:wrap;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ld{width:6px;height:6px;border-radius:1px;display:inline-block;margin-right:5px}
.btn{padding:7px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;border:1px solid var(--bd);background:transparent;color:var(--t2);transition:all .2s}
.btn:hover{background:var(--bg-e);color:var(--t1);border-color:var(--bd-m)}
.btn.blue{background:var(--p1);color:#fff;border-color:var(--p1)}.btn.blue:hover{background:var(--p1h)}
.btn.sm{padding:4px 9px;font-size:11px}
.sp{background:var(--bg-s);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1rem}
.sp textarea{width:100%;font-size:10px;height:48px;font-family:'JetBrains Mono',monospace;resize:none;border:1px solid var(--bd);border-radius:5px;padding:8px;margin-bottom:10px;box-sizing:border-box;background:var(--bg-c);color:var(--t2)}
.empty{text-align:center;padding:2.5rem;color:var(--t3);font-size:13px}
.di{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;color:var(--t1);background:var(--bg-s);font-family:'Space Grotesk',sans-serif}
.di:focus{outline:none;border-color:var(--bd-m)}
.nim{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;color:var(--t1);background:var(--bg-s);font-family:'JetBrains Mono',monospace}
.nim:focus{outline:none;border-color:var(--bd-m)}
.dz{border:1.5px dashed var(--bd-m);border-radius:10px;padding:3rem 2rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg-s)}
.dz:hover,.dz.over{border-color:var(--p1);background:var(--p1s)}
.spinner{width:36px;height:36px;border:2px solid var(--bd);border-top-color:var(--p1);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 1.5rem}
.fmt-badge{padding:3px 9px;background:var(--bg-e);border:1px solid var(--bd);border-radius:5px;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.preview-table{width:100%;border-collapse:collapse;font-size:12px}
.preview-table th{padding:8px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;border-bottom:1px solid var(--bd)}
.preview-table td{padding:5px 8px;border-bottom:1px solid var(--bd)}
.preview-table tr:last-child td{border-bottom:none}
.preview-table input{width:100%;padding:5px 8px;border:1px solid transparent;border-radius:5px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--t1);background:transparent;transition:border-color .2s}
.preview-table input:hover{border-color:var(--bd)}
.preview-table input:focus{outline:none;border-color:var(--p1);background:var(--bg-s)}
/* Tools */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:1rem}
.tools-result{background:var(--bg-s);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;margin-top:1rem}
.tax-breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:1rem}
.tax-item{background:var(--bg-c);padding:.75rem 1rem}
.tax-label{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:4px}
.tax-val{font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--t1)}
.step-badge{width:22px;height:22px;border-radius:50%;background:var(--p1s);border:1px solid var(--p1b);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--p1);flex-shrink:0}
.info-green{background:rgba(34,197,94,0.07);border:1px solid rgba(34,197,94,0.15);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.info-blue{background:var(--p1s);border:1px solid var(--p1b);border-radius:8px;padding:12px 14px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:500;padding:1rem}
.modal-box{background:var(--bg-c);border:1px solid var(--bd);border-radius:12px;padding:2rem;max-width:480px;width:100%;max-height:85vh;overflow-y:auto}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg-s)}::-webkit-scrollbar-thumb{background:var(--bg-e);border-radius:3px}
@media(max-width:600px){.cg{grid-template-columns:1fr}.ig{grid-template-columns:repeat(2,1fr)}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

// TAX FUNCTIONS
function calcFederalTax(income,status){
  const ded=status==='married'?29200:14600;
  const taxable=Math.max(0,income-ded);
  const brackets=status==='married'?[[23200,.10],[94300,.12],[201050,.22],[383900,.24],[487450,.32],[731200,.35],[Infinity,.37]]:[[11600,.10],[47150,.12],[100525,.22],[191950,.24],[243725,.32],[609350,.35],[Infinity,.37]];
  let tax=0,prev=0;
  for(const[limit,rate]of brackets){if(taxable<=prev)break;tax+=(Math.min(taxable,limit)-prev)*rate;prev=limit;}
  return tax;
}
function calcTax(netProfit,state,filing){
  const seTaxBase=netProfit*0.9235,seTax=seTaxBase*0.153,seDeduct=seTax/2;
  const adj=netProfit-seDeduct;
  const fedTax=calcFederalTax(adj,filing);
  const stateRate=(STATES.find(s=>s.c===state)?.r||0)/100;
  const stateTax=adj*stateRate;
  const totalAnnual=seTax+fedTax+stateTax;
  return{seTax:Math.round(seTax),fedTax:Math.round(fedTax),stateTax:Math.round(stateTax),totalAnnual:Math.round(totalAnnual),quarterly:Math.round(totalAnnual/4),monthly:Math.round(totalAnnual/12),effectiveRate:netProfit>0?totalAnnual/netProfit*100:0};
}

  const income=Number(document.getElementById('tax-income')?.value)||0;

}

// PREDICTION
function predictNextMonth(md){
  if(md.length<2)return null;
  const n=md.length,sx=md.reduce((s,_,i)=>s+i,0),sy=md.reduce((s,m)=>s+m.revenue,0);
  const sxy=md.reduce((s,m,i)=>s+i*m.revenue,0),sx2=md.reduce((s,_,i)=>s+i*i,0);
  const slope=(n*sxy-sx*sy)/(n*sx2-sx*sx);
  const intercept=(sy-slope*sx)/n;
  return Math.max(0,Math.round(slope*n+intercept));
}

    h+=`<div class="card"><p class="ct">Compare <strong style="color:var(--t1)">${r.name}</strong> against:</p>${!reports.filter(x=>x.id!==activeId).length?'<p style="font-size:13px;color:var(--t3)">Create a second report to compare periods.</p>':`<div style="display:flex;gap:6px;flex-wrap:wrap">${reports.filter(x=>x.id!==activeId).map(rep=>`<button class="chip ${compareId===rep.id?'active':''}" onclick="setCmp('${rep.id}')">${rep.name}</button>`).join('')}</div>`}</div>`;
    if(compR&&compAgg){[{l:'Total revenue',a:totRev,b:compAgg.totRev,f:fmt},{l:'Net profit',a:netP,b:compAgg.netP,f:fmt},{l:'Profit margin',a:pMgn,b:compAgg.pMgn,f:v=>v.toFixed(1)+'%'},{l:'Effective rate',a:effR,b:compAgg.effR,f:fmtR}].forEach(({l,a,b,f})=>{const d=a-b,better=d>=0;h+=`<div class="cc"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:10px">${l}</div><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:10px;color:var(--t3);margin-bottom:4px">${r.name}</div><div style="font-size:20px;font-weight:700;color:${p1};font-family:'JetBrains Mono',monospace">${f(a)}</div></div><div style="text-align:center"><div style="font-size:13px;font-weight:700;color:${better?'var(--ok)':'var(--err)'};font-family:'JetBrains Mono',monospace">${better?'+':''}${f(d)}</div><div style="font-size:10px;color:var(--t3)">difference</div></div><div style="text-align:right"><div style="font-size:10px;color:var(--t3);margin-bottom:4px">${compR.name}</div><div style="font-size:20px;font-weight:700;color:${p2};font-family:'JetBrains Mono',monospace">${f(b)}</div></div></div></div>`;});
    const ml=Math.max(r.duration,compR.duration);h+=`<div class="card"><p class="ct">Revenue comparison</p><div class="leg"><span><span class="ld" style="background:${p1}"></span>${r.name}</span><span><span class="ld" style="background:${p2}"></span>${compR.name}</span></div><div class="cw"><canvas id="cCmp" role="img" aria-label="Comparison">Revenue comparison.</canvas></div></div>`;}
  }

  if(tab==='tools'){
    const annualNetP=netP/r.duration*12;
    h+=`<div class="card"><p class="ct">Tax estimator</p>
    <p style="font-size:13px;color:var(--t2);line-height:1.75;margin-bottom:1rem">Estimate your quarterly tax payment based on your state, filing status, and net profit. <strong style="color:var(--t1)">This is for planning purposes only</strong> — always consult a tax professional for exact figures.</p>
    <div class="tools-grid">
      <div><label class="al">State</label><select id="tax-state" class="di" style="padding:8px 10px" onchange="taxState=this.value">${STATES.map(s=>`<option value="${s.c}"${taxState===s.c?' selected':''}>${s.n}${s.r===0?' (no income tax)':''}</option>`).join('')}</select></div>
      <div><label class="al">Filing status</label><select id="tax-filing" class="di" style="padding:8px 10px" onchange="taxFiling=this.value"><option value="single"${taxFiling==='single'?' selected':''}>Single</option><option value="married"${taxFiling==='married'?' selected':''}>Married filing jointly</option></select></div>
      <div><label class="al">Annual net profit ($)</label><input type="number" class="nim" id="tax-income" value="${Math.round(annualNetP)||0}" placeholder="Enter your annual net profit"></div>
    </div>
    <button class="btn blue" onclick="runTaxCalc()">Calculate taxes →</button>
    <div id="tax-result-box">${taxResult?renderTaxResult():''}</div>
    </div>`;

    h+=`<div class="card"><p class="ct">Break-even calculator</p>
    <p style="font-size:13px;color:var(--t2);line-height:1.75;margin-bottom:1rem">Find out exactly how much revenue you need to earn each month to cover your costs and break even.</p>
    <div class="tools-grid">
      <div><label class="al">Monthly fixed expenses ($)</label><input type="number" class="nim" id="be-fixed" value="${beFixed||Math.round(totRev>0?totRev/r.duration*.5:0)}" placeholder="Rent, software, etc."></div>
      <div><label class="al">Variable costs (% of revenue)</label><input type="number" class="nim" id="be-variable" value="${beVariable}" min="0" max="99" placeholder="0"></div>
    </div>
    <button class="btn blue" onclick="runBreakEven()">Calculate →</button>
    <div id="be-result-box">${beResult!==null?renderBreakEven():''}</div>
    </div>`;
  }

  document.getElementById('content').innerHTML=h;
  setTimeout(()=>doCharts(r,agg,compR,compAgg,sl,p1,p2,CLR),50);
}

function doCharts(r,agg,compR,compAgg,sl,p1,p2,CLR){
  const o=getChartOpts(v=>'$'+Math.round(v/1000)+'k');
  const oF=cb=>({...o,scales:{...o.scales,y:{...o.scales.y,ticks:{...o.scales.y.ticks,callback:cb}}}});
  if(tab==='overview'){mkChart('cRev',{type:'line',data:{labels:sl,datasets:[{label:'Revenue',data:r.month_data.map(m=>m.revenue),borderColor:p1,borderWidth:1.5,pointRadius:0,tension:.4},{label:'Expenses',data:r.month_data.map(m=>m.expenses),borderColor:p2,borderWidth:1.5,pointRadius:0,tension:.4}]},options:o});mkChart('cProfit',{type:'bar',data:{labels:sl,datasets:[{label:'Profit',data:r.month_data.map(m=>m.revenue-m.expenses),backgroundColor:r.month_data.map(m=>m.revenue-m.expenses>=0?p1:p2),borderRadius:2}]},options:o});}
  if(tab==='clients'&&r.clients.length){mkChart('cClPie',{type:'doughnut',data:{labels:r.clients.map(c=>c.name),datasets:[{data:r.clients.map(c=>c.revenue),backgroundColor:CLR.slice(0,r.clients.length),borderWidth:0,hoverOffset:4}]},options:{...o,cutout:'65%'}});mkChart('cClBar',{type:'bar',data:{labels:r.clients.map(c=>c.name),datasets:[{label:'Revenue',data:r.clients.map(c=>c.revenue),backgroundColor:CLR.slice(0,r.clients.length),borderRadius:2}]},options:oF(v=>fmt(v))});}
  if(tab==='goals'){mkChart('cGoal',{type:'bar',data:{labels:sl,datasets:[{label:'Revenue',data:r.month_data.map(m=>m.revenue),backgroundColor:p1,borderRadius:2},{label:'Goal',data:r.month_data.map(()=>r.goals.revenue),backgroundColor:p2,borderRadius:2}]},options:o});}
  if(tab==='compare'&&compR){const ml=Math.max(r.duration,compR.duration);mkChart('cCmp',{type:'line',data:{labels:Array.from({length:ml},(_,i)=>`Mo ${i+1}`),datasets:[{label:r.name,data:Array.from({length:ml},(_,i)=>r.month_data[i]?.revenue??null),borderColor:p1,borderWidth:1.5,pointRadius:0,tension:.4,spanGaps:true},{label:compR.name,data:Array.from({length:ml},(_,i)=>compR.month_data[i]?.revenue??null),borderColor:p2,borderWidth:1.5,pointRadius:0,tension:.4,spanGaps:true}]},options:o});}
}

// ACTIONS
function switchR(id){activeId=id;activeMonth=0;compareId=null;render();}
function switchTab(t){tab=t;render();}
function setAM(i){activeMonth=i;render();}
function setCmp(id){compareId=id;render();}
function toggleShare(){showShare=!showShare;render();}
function toggleTheme(){showTheme=!showTheme;render();}
function toggleImport(){showImport=!showImport;if(showImport){showShare=false;showTheme=false;importStep='upload';importPreview=null;}render();}
function setDur(d){const r=getR(),cur=r.month_data,nd=d>cur.length?[...cur,...Array.from({length:d-cur.length},()=>({...DEF}))]:cur.slice(0,d);if(activeMonth>=d)activeMonth=d-1;updR({duration:d,month_data:nd});}
function updMD(i,f,v){const r=getR(),md=[...r.month_data];md[i]={...md[i],[f]:f==='notes'?v:f==='recurring'?Boolean(v):Number(v)||0};updR({month_data:md});}
function addClient(){const n=document.getElementById('cn')?.value.trim(),rev=Number(document.getElementById('cr')?.value)||0;if(!n)return;const r=getR();updR({clients:[...r.clients,{id:uid(),name:n,revenue:rev}]});}
function rmClient(id){const r=getR();updR({clients:r.clients.filter(c=>c.id!==id)});}
function saveKey(){const k=document.getElementById('api-input')?.value.trim();if(!k)return;localStorage.setItem('nd_api_key',k);render();}

async function genInsights(){const r=getR(),key=localStorage.getItem('nd_api_key');if(!key)return;const labels=getLabels(r.start_month,r.start_year,r.duration),agg=calcAgg(r),{totRev,netP,pMgn,effR}=agg,btn=document.getElementById('gen-btn'),out=document.getElementById('ins-out');if(btn){btn.disabled=true;btn.textContent='Analyzing...';}if(out)out.innerHTML='<div class="ib">Analyzing your data...</div>';const sum=r.month_data.map((m,i)=>`${labels[i]?.label}: Revenue $${m.revenue}, Expenses $${m.expenses}, Hours ${m.hours}, Projects ${m.projects}${m.notes?', Note: '+m.notes:''}`).join('\n'),cSum=r.clients.length?'\nClients: '+r.clients.map(c=>`${c.name} $${c.revenue}`).join(', '):'';try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:'You are a sharp freelance business analyst. Return exactly 6 numbered, specific, actionable insights. Be direct, data-driven, include actual numbers. Cover trends, efficiency, pricing, risk, growth. Max 2 sentences each. No preamble.',messages:[{role:'user',content:`Business: ${r.biz_name}\nPeriod: ${labels[0]?.label}–${labels[labels.length-1]?.label}\n${sum}${cSum}\nGoal: $${r.goals.revenue}/mo\nTotals: Revenue ${fmt(totRev)}, Profit ${fmt(netP)}, Margin ${pct(pMgn)}, Rate ${fmtR(effR)}`}]})});const d=await res.json();if(d.error)throw new Error(d.error.message);const text=d.content?.map(b=>b.text||'').join('')||'No insights returned.';updR({insights:text});}catch(e){if(out)out.innerHTML=`<div class="ib" style="color:var(--err)">Error: ${e.message}</div>`;if(btn){btn.disabled=false;btn.textContent='Generate insights →';}}}

async function importReport(){const code=document.getElementById('load-input')?.value.trim();if(!code)return;try{const d=JSON.parse(atob(code));const nr={...d,id:uid(),db_id:null,name:(d.name||'Imported')+' (imported)',insights:'',month_data:(d.month_data||[]).map(m=>({...DEF,...m}))};reports.push(nr);activeId=nr.id;await saveToDB(nr);showShare=false;render();}catch{alert('Invalid share code.');}}

async function exportPDF(){const r=getR(),btn=document.getElementById('pdf-btn');if(btn){btn.textContent='Exporting...';btn.disabled=true;}const pal=PALETTES[themePalette]||PALETTES.nova;const[r1,g1,b1]=h2r(pal.p1);try{if(!window.jspdf)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});const{jsPDF}=window.jspdf,doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const W=210,mg=18,cW=W-mg*2,labels=getLabels(r.start_month,r.start_year,r.duration),agg=calcAgg(r),{totRev,netP,pMgn,effR,avgR,totProj}=agg,period=`${labels[0]?.label} – ${labels[labels.length-1]?.label}`;doc.setFillColor(r1,g1,b1);doc.rect(0,0,W,40,'F');doc.setTextColor(255,255,255);doc.setFontSize(20);doc.setFont('helvetica','bold');doc.text(r.biz_name||'Freelance Business',mg,17);doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text(`Analytics Report · ${r.name}`,mg,25);doc.text(period,mg,32);doc.text(`${uname} · ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}`,W-mg,32,{align:'right'});let y=50;doc.setTextColor(28,28,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Key performance indicators',mg,y);y+=8;const kI=[['Total Revenue',fmt(totRev)],['Net Profit',fmt(netP)],['Profit Margin',pct(pMgn)],['Effective Rate',fmtR(effR)],['Avg Monthly',fmt(avgR)],['Total Projects',String(totProj)]],cw2=(cW-4)/2;kI.forEach(([lb,vl],i)=>{const col=i%2,row=Math.floor(i/2),x=mg+col*(cw2+4),ky=y+row*18;doc.setFillColor(240,240,245);doc.roundedRect(x,ky,cw2,15,2,2,'F');doc.setTextColor(130,130,150);doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.text(lb.toUpperCase(),x+4,ky+6);doc.setTextColor(20,20,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text(vl,x+4,ky+12.5);});y+=Math.ceil(kI.length/2)*18+14;doc.setTextColor(28,28,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Monthly breakdown',mg,y);y+=7;const tC=['Month','Revenue','Expenses','Net Profit','Hours','Rate/Hr','Recurring','Notes'],tW=[18,24,24,24,16,16,20,28];const sw=tW.map(w=>w*cW/tW.reduce((a,b)=>a+b,0));doc.setFillColor(r1,g1,b1);doc.rect(mg,y,cW,8,'F');doc.setTextColor(255,255,255);doc.setFontSize(7.5);doc.setFont('helvetica','bold');let cx=mg;tC.forEach((c,i)=>{doc.text(c,cx+2,y+5.5);cx+=sw[i];});y+=8;r.month_data.forEach((m,idx)=>{const pr=m.revenue-m.expenses,r2=m.hours>0?Math.round(m.revenue/m.hours):0,cells=[labels[idx]?.short||'',fmt(m.revenue),fmt(m.expenses),fmt(pr),String(m.hours),`$${r2}`,m.recurring?'Yes':'No',(m.notes||'').slice(0,20)];if(idx%2===0){doc.setFillColor(248,248,252);doc.rect(mg,y,cW,7,'F');}doc.setTextColor(60,60,80);doc.setFontSize(7.5);doc.setFont('helvetica','normal');cx=mg;cells.forEach((c,i)=>{doc.text(String(c),cx+2,y+5);cx+=sw[i];});y+=7;});y+=12;if(r.clients.length){if(y>240){doc.addPage();y=20;}doc.setTextColor(28,28,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Client breakdown',mg,y);y+=7;const cCols=['Client','Revenue','% of Total'],cW2=[80,50,cW-130];doc.setFillColor(r1,g1,b1);doc.rect(mg,y,cW,8,'F');doc.setTextColor(255,255,255);doc.setFontSize(7.5);doc.setFont('helvetica','bold');cx=mg;cCols.forEach((c,i)=>{doc.text(c,cx+2,y+5.5);cx+=cW2[i];});y+=8;const cTot=r.clients.reduce((s,c)=>s+c.revenue,0);r.clients.forEach((c,i)=>{if(i%2===0){doc.setFillColor(248,248,252);doc.rect(mg,y,cW,7,'F');}doc.setTextColor(60,60,80);doc.setFontSize(7.5);doc.setFont('helvetica','normal');cx=mg;[c.name,fmt(c.revenue),cTot>0?(c.revenue/cTot*100).toFixed(1)+'%':'0%'].forEach((t,i2)=>{doc.text(t,cx+2,y+5);cx+=cW2[i2];});y+=7;});y+=12;}if(r.insights){if(y>240){doc.addPage();y=20;}doc.setTextColor(28,28,28);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('AI business insights',mg,y);y+=8;doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(80,80,100);doc.splitTextToSize(r.insights,cW).forEach(line=>{if(y>272){doc.addPage();y=20;}doc.text(line,mg,y);y+=5;});}const pc=doc.internal.getNumberOfPages();for(let p=1;p<=pc;p++){doc.setPage(p);doc.setFillColor(r1,g1,b1);doc.rect(0,285,W,12,'F');doc.setTextColor(255,255,255);doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.text(`${r.biz_name} · ${r.name}`,mg,292);doc.text(`Page ${p} of ${pc}`,W-mg,292,{align:'right'});}doc.save((r.biz_name||'freelance').toLowerCase().replace(/\s+/g,'-')+'-'+r.name.toLowerCase().replace(/\s+/g,'-')+'.pdf');}catch(e){console.error(e);}if(btn){btn.textContent='Export PDF';btn.disabled=false;}}

window.addEventListener('load',async()=>{applyTheme(themeMode,themePalette);const{data:{session}}=await sb.auth.getSession();if(session?.user)await initApp(session.user);else{document.getElementById('auth-screen').style.display='flex';document.getElementById('name-wrap').style.display='none';}document.getElementById('loading').style.display='none';});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('auth-screen').style.display!=='none')handleAuth();if(e.key==='Escape'&&showApiGuide){showApiGuide=false;render();}});
</script>
